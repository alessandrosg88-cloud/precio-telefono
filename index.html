// Busca por nombre en alemán, francés, italiano y portugués (YGOPRODeck) y en español (Yugipedia).
// Devuelve las cartas en inglés + el nombre que coincidió: { cards, hit: { id: { lang, name } } }
async function searchYugiohLocal(q){
  const hit = {};
  const viaYgo = ['de', 'fr', 'it', 'pt'].map(l => getJSON(`${YGO}/cardinfo.php?fname=${encodeURIComponent(q)}&language=${l}`).catch(() => null)
    .then(r => (r?.data || []).forEach(c => { hit[c.id] ||= { lang: l, name: c.name }; })));
  // Yugipedia distingue mayúsculas y acentos ("dragon" no encuentra "Dragón"). Por eso cada palabra se busca
  // con comodines en la primera letra, las vocales y la n (dragon -> *r*g*n, que sí encuentra Dragón/dragón)
  // y luego comprobamos el nombre sin acentos ni mayúsculas.
  const plain = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const qw = plain(q).split(/[^a-z0-9ñ]+/).map(w => w.replace(/ñ/g, 'n')).filter(w => w.length > 1).slice(0, 6);
  const pat = w => ('*' + w.slice(1).replace(/[aeiouyn]/g, '*') + '*').replace(/\*+/g, '*');
  const strong = qw.filter(w => pat(w).replace(/\*/g, '').length >= 1);
  const cond = l => strong.map(w => `[[${l} name::~${pat(w)}]]`).join('');
  const fits = name => { const n = plain(name).replace(/ñ/g, 'n'); return qw.every(w => n.includes(w)); };
  // una consulta por idioma (Yugipedia no admite bien varias con OR)
  const viaYgp = !strong.length ? [] : Object.entries(YLANGS).map(([lang, l]) => getJSON(YGP_ASK + encodeURIComponent(`[[Category:TCG cards]]${cond(l[0])}|?Password|?${l[0]} name|limit=500`)).catch(() => null)
    .then(r => Object.values(r?.query?.results || {}).forEach(x => {
      const id = Number(x.printouts.Password?.[0]), name = x.printouts[`${l[0]} name`]?.[0] || '';
      if (!id || hit[id] || !fits(name)) return;
      hit[id] = { lang, name };
    })));
  await Promise.all([...viaYgo, ...viaYgp]);
  const ids = Object.keys(hit).slice(0, 80);
  if (!ids.length) return { cards: [], hit };
  const r = await getJSON(`${YGO}/cardinfo.php?id=${ids.join(',')}`).catch(() => null);
  return { cards: r?.data || [], hit };
}

const OCG_REG = { JP: 'japonesa', JA: 'japonesa (Asia)', KR: 'coreana', AE: 'asiática en inglés', SC: 'china (simplificada)', TC: 'china (tradicional)' };

    const par = {};
    for (const x of b[1].split('|')) { const i = x.indexOf('='); if (i > 0) par[x.slice(0, i).trim()] = x.slice(i + 1).trim(); }
    const defR = (par.rarities || '').split(',').map(r => r.trim()).filter(Boolean);
    for (const line of b[2].split('\n')) {
      const [main, opt = ''] = line.split('//');
      const f = main.split(';').map(x => x.trim());
      if (!f[0] || !f[1]) continue;
      const rs = (f[2] ? f[2].split(',').map(r => r.trim()).filter(Boolean) : defR).map(r => ABBR_RAR[r] || r);
      out.push({ code: f[0].toUpperCase(), name: f[1], rs: rs.length ? rs : ['—'], ea: /extended art|overframe/i.test(opt + ' ' + (par.options || '')) });

  for (const page of pages) {
    const list = await (setListCache[page] ||= getJSON('https://yugipedia.com/api.php?action=query&prop=revisions&rvprop=content&rvslots=main&format=json&origin=*&titles=' + encodeURIComponent(page))
      .then(j => parseSetList(Object.values(j?.query?.pages || {})[0]?.revisions?.[0]?.slots?.main?.['*'] || '')).catch(() => (delete setListCache[page], [])));
    const hits = list.filter(x => x.code === code);
    if (hits.length) return { setName: page.replace(/^Set Card Lists:/, '').replace(/\s*\((OCG|TCG)-[A-Z]+\)\s*$/, ''), hits };
  }

}

// Expansiones por nombre (YGOPRODeck). Acepta números en vez de romanos y sin la s final: «legendary deck 2» = «Legendary Decks II»
let ygoSetList = null;
async function ygoSetsByName(q){
  const ROM = { 1: 'i', 2: 'ii', 3: 'iii', 4: 'iv', 5: 'v', 6: 'vi', 7: 'vii', 8: 'viii', 9: 'ix', 10: 'x', 22: 'ii' };
  const w = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').split(/[^a-z0-9]+/).filter(Boolean)
    .map(t => (ROM[t] || t).replace(/s$/, ''));
  const qw = w(q); if (!qw.length || qw.join('').length < 3) return [];
  ygoSetList ||= getJSON(`${YGO}/cardsets.php`).catch(() => (ygoSetList = null, []));
  const all = (await ygoSetList) || [];
  const hits = all.filter(x => { const sw = w(x.set_name); return qw.every(t => sw.some(y => y === t || (t.length > 2 && y.startsWith(t)))); });
  return hits.sort((a, b) => String(b.tcg_date || '').localeCompare(String(a.tcg_date || '')));
}
// Expansiones por su código (EGO1, LDK2…). Tolera las letras que se confunden con números: EG01 = EGO1, LD1 = LDI…
const codeKey = c => String(c || '').toUpperCase().replace(/O/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/B/g, '8').replace(/Z/g, '2');
async function ygoSetsByCode(prefix){
  ygoSetList ||= getJSON(`${YGO}/cardsets.php`).catch(() => (ygoSetList = null, []));
  const all = (await ygoSetList) || [];
  const P = String(prefix).toUpperCase();
  const exact = all.filter(x => String(x.set_code).toUpperCase() === P);
  if (exact.length) return exact;
  const near = all.filter(x => codeKey(x.set_code) === codeKey(P));
  if (near.length || P.length < 4) return near;
  // una letra de más o de menos (LODK2 -> LDK2)
  const k = codeKey(P), oneOff = (a, b) => { if (Math.abs(a.length - b.length) !== 1) return false;
    const [l, s] = a.length > b.length ? [a, b] : [b, a]; for (let i = 0; i < l.length; i++) if (l.slice(0, i) + l.slice(i + 1) === s) return true; return false; };
  return all.filter(x => oneOff(codeKey(x.set_code), k));
}
async function searchYugioh(q){
  // solo el código de la expansión («EGO1», «EG01-EN», «LDK2»): enseña todas sus cartas
  // con una letra de mazo detrás («LDK2-ENY» = el mazo de Yugi) solo se enseñan esas cartas
  const sc = q.toUpperCase().replace(/\s+/g, '').match(/^([A-Z0-9]{2,5})(?:-([A-Z]{0,2})([A-Z]?))?$/);
  if (sc && (/\d/.test(sc[1]) || q.includes('-'))) { const sets = await ygoSetsByCode(sc[1]);
    if (sets.length === 1) return openYugiohSet(sets[0].set_name, sc[3] ? `${sets[0].set_code}-${sc[2] || 'EN'}${sc[3]}` : '');
    if (sets.length > 1) return renderGrid(T('{0} expansiones', sets.length), sets.map(x => ({ img: x.set_image || '', title: x.set_name,
      sub: [x.set_code, x.tcg_date, T('{0} cartas', x.num_of_cards)].filter(Boolean).join(' · '), price: '', v: null, open: () => openYugiohSet(x.set_name, sc[3] ? `${x.set_code}-${sc[2] || 'EN'}${sc[3]}` : '') }))); }
  // el número puede llevar una letra delante: LDK2-ENK01 / ENY01 / ENJ01 (Legendary Decks II), YGLD-ENA01, DPKB-ENA01…
  const m = q.toUpperCase().replace(/\s+/g, '').match(/^([A-Z0-9]+)-([A-Z]{0,2})([A-Z]?\d+)$/);
  if (m && OCG_REG[m[2]]) return searchYugiohOCG(q.toUpperCase().replace(/\s+/g, ''));
  if (m) {
    const typed = q.toUpperCase().replace(/\s+/g, '');
    const lang = CODE_LANG[m[2]] || null;
    // el número con 2 o 3 cifras: LEDD-ENA001 -> LEDD-ENA01 (y al revés), por si se escribe con un cero de más o de menos
    const [, L = '', D = ''] = m[3].match(/^([A-Z]?)(\d+)$/) || [];
    const nums = [...new Set([m[3], ...[2, 3].map(w => L + String(Number(D)).padStart(w, '0'))])];
    const tries = nums.flatMap(n => [`${m[1]}-${m[2]}${n}`, `${m[1]}-EN${n}`, `${m[1]}-${n}`, `${m[1]}-E${n}`]);
    for (const code of [...new Set(tries)]) {
      const info = await getJSON(`${YGO}/cardsetsinfo.php?setcode=${encodeURIComponent(code)}`).catch(() => null);
      if (info && info.id) {
        const card = (await getJSON(`${YGO}/cardinfo.php?id=${info.id}`))?.data?.[0];
        return openYugioh(card, code, info.set_rarity, lang ? { lang, code: typed } : null);
      }
    }
    // ¿la expansión está mal escrita (EG01 en vez de EGO1)? prueba con los códigos de expansión parecidos
    for (const x of (await ygoSetsByCode(m[1])).filter(x => String(x.set_code).toUpperCase() !== m[1]))
      for (const n of nums) for (const code of [`${x.set_code}-${m[2] || 'EN'}${n}`, `${x.set_code}-EN${n}`]) {
        const info = await getJSON(`${YGO}/cardsetsinfo.php?setcode=${encodeURIComponent(code)}`).catch(() => null);
        if (info && info.id) { const card = (await getJSON(`${YGO}/cardinfo.php?id=${info.id}`))?.data?.[0];
          return openYugioh(card, code, info.set_rarity, lang ? { lang, code: typed } : null); }
      }
    // YGOPRODeck no lo tiene (p. ej. LC01-EN001, Obelisco de la Legendary Collection): lista de la expansión en Yugipedia
    for (const n of nums) { const code = `${m[1]}-${m[2]}${n}`; if (await ocgLookup(code)) return searchYugiohOCG(code); }
    return error(T('No encontré ese código. Revisa que esté bien escrito (ej. LOB-EN001).'));
  }
  const r = await getJSON(`${YGO}/cardinfo.php?fname=${encodeURIComponent(q)}`);
  let cards = r?.data || [], hit = {};
  // ¿es el nombre de una expansión? («legendary decks 2», «Legendary Decks II»…): enseña sus cartas
  if (!cards.length) { const sets = await ygoSetsByName(q); if (sets.length === 1) return openYugiohSet(sets[0].set_name);
    if (sets.length > 1) return renderGrid(T('{0} expansiones', sets.length), sets.slice(0, 60).map(x => ({ img: x.set_image || '', title: x.set_name,
      sub: [x.set_code, x.tcg_date, T('{0} cartas', x.num_of_cards)].filter(Boolean).join(' · '), price: '', v: null, open: () => openYugiohSet(x.set_name) }))); }
  if (!cards.length) ({ cards, hit } = await searchYugiohLocal(q)); // no está en inglés: alemán, francés, italiano, portugués o español
  if (!cards.length) return error(T('No encontré esa carta. Prueba con el código o con su nombre en inglés, alemán, francés, italiano, portugués o español.'));
  const loc = c => hit[c.id] ? { lang: hit[c.id].lang } : null;
  if (cards.length === 1) return openYugioh(cards[0], null, null, loc(cards[0]));
  renderGrid(T('{0} resultados', cards.length), cards.slice(0, 80).map(c => ({
    img: c.card_images?.[0]?.image_url_small, title: hit[c.id]?.name || c.name, sub: hit[c.id] ? c.name : '',
    real: () => ygoRealImg(c, c.card_sets?.[0]?.set_code, c.card_sets?.[0]?.set_rarity, true).then(u => u || ygoRealImg(c, null, null, true)),
    price: eur(c.card_prices?.[0]?.cardmarket_price), open: () => openYugioh(c, null, null, loc(c)) })));
}

// ---- Precio de TCGplayer de cada impresión (lo descarga cada día la GitHub Action en data/ygo/) ----
// El set_price de YGOPRODeck mezcla impresiones que comparten código (p. ej. LOB-EN001 original y 25 aniversario)
// y a menudo está desactualizado, así que usamos el precio de mercado de TCGplayer de cada producto.
const ygoNorm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
const ygoShard = n => ygoNorm(n).replace(/ /g, '').slice(0, 2).padEnd(2, '_');
// «Overframe» (en inglés «Extended Art»): el dibujo sale del marco. Es otra versión de la carta, con otro precio.
// TCGplayer la llama «Extended Art» y así se guarda en la colección; en pantalla se enseña como Overframe.
// ofx: Starlight / Grand Master Rare de un código que tiene Overframe: también lo son, aunque TCGplayer no lo ponga
// (p. ej. MAMS-EN013: Ultra Rare, Starlight y GMR Overframe según la lista de Yugipedia)
const isOF = s => typeof s === 'string' ? /extended art|overframe/i.test(s) : !!s?.ofx || /extended art|overframe/i.test(s?.variant || '');
const ofText = t => String(t || '').replace(/Extended Art/g, 'Overframe').replace(/Emblazoned/g, 'Con sello');
// «Emblazoned» (TCGplayer): con el sello del World Championship estampado en el cuadro del efecto (p. ej. 26LP-EN002)
const isStamp = s => /emblazoned/i.test(typeof s === 'string' ? s : s?.variant || '');
const stampName = setName => { const y = String(setName || '').match(/World Championship (\d{4})/i); return y ? `Sello WCS ${y[1]}` : 'Con sello'; };
const STAMP_BADGE = (setName) => `<span class="stb" title="Con el sello del World Championship estampado en el cuadro del efecto">🏅 ${stampName(setName)}</span>`;
const OF_BADGE = '<span class="ofb" title="Overframe (Extended Art): el dibujo sale del marco">🖼️ Overframe</span>';
// Grand Master Rare: tirada muy corta con número de serie
const isGMR = s => /grand master rare/i.test(typeof s === 'string' ? s : s?.set_rarity || s?.rarity || '');
const GMR_BADGE = '<span class="gmrb" title="Grand Master Rare: tirada muy corta con número de serie">🏆 Grand Master Rare</span>';
// Starlight Rare: la rareza más brillante (y cara) de las expansiones normales
const isStR = s => /starlight rare/i.test(typeof s === 'string' ? s : s?.set_rarity || s?.rarity || '');
const STR_BADGE = '<span class="strb" title="Starlight Rare">✨ Starlight Rare</span>';
// etiquetas pequeñas sobre la miniatura de una versión (puede llevar dos: Starlight + Overframe)
const tileTags = (of, gmr, str, st) => [st && [' st', 'Sello'], of && ['', 'Overframe'], gmr && [' gmr', 'GMR'], str && [' str', 'Starlight']].filter(Boolean).slice(0, 2)
  .map(([c, t], k) => `<span class="oft${c}${k ? ' t2' : ''}">${t}</span>`).join('');
// etiquetas de una carta guardada o vista: { of, gmr, str, st } (Overframe, GMR, Starlight, con sello)
const specialOf = x => { if (!x || (x.game || x.g) !== 'yugioh') return null;
  const t = [x.label, x.rarity, x.id].filter(Boolean).join(' ');
  const r = { of: !!(x.of || x.tg?.of) || isOF(t), gmr: isGMR(t), str: isStR(t), st: isStamp(t) };
  return r.of || r.gmr || r.str || r.st ? r : null; };
const thumbTags = x => { const t = specialOf(x); return t ? tileTags(t.of, t.gmr, t.str, t.st) : ''; };
// foto de la versión Overframe de una impresión (Yugipedia marca esos escaneos con «-EA»); null si no la tiene
const ofImgCache = {};
function ofImageFor(code, rarity){
  const k = code + '|' + rarity;
  return ofImgCache[k] ||= (async () => {
    const info = await getJSON(`${YGO}/cardsetsinfo.php?setcode=${encodeURIComponent(code)}`).catch(() => null);
    if (!info?.name) return null;
    const scans = await ygpScans(info.name, String(code).toUpperCase().split('-')[0]);
    const s = pickScan(scans, code, rarity, true);
    return s && s.extra.includes('EA') ? s.url : null;
  })().catch(() => null);
}
const codeOFCache = {};
function codeIsOF(code, rarity){
  const k = code + '|' + rarity;
  return codeOFCache[k] ||= (async () => {
    const info = await getJSON(`${YGO}/cardsetsinfo.php?setcode=${encodeURIComponent(code)}`).catch(() => null);
    if (!info?.name) return false;
    const pr = await ygoPrints(info.name);
    const same = (pr?.list || []).filter(e => normCode(e.c) === normCode(code));
    return same.some(e => e.r === rarity && (e.of || /extended art/i.test(e.v || ''))) ||
      (/starlight|grand master/i.test(rarity) && same.some(e => /extended art/i.test(e.v || '')));
  })().catch(() => false);
}
const isEAimg = u => /-EA[.-]/i.test(String(u || ''));
let pendingLabel = null; // versión guardada en la colección que hay que abrir (ver openItem)
const printCache = {};
async function ygoPrints(name){
  const k = ygoShard(name);
  const f = await (printCache[k] ||= fetch(`data/ygo/${k}.json`).then(r => r.ok ? r.json() : null).catch(() => null));
  return f ? { updated: f.updated, list: f.d[ygoNorm(name)] || [] } : null;
}
// Lista de versiones de una carta. TCGplayer manda: YGOPRODeck tiene rarezas mal puestas en algunas
// impresiones ("New", "2", "Reprint", Common donde es Ultra Rare…) y le faltan rarezas (p. ej. los 7 de
// las Rarity Collection). Para cada código usamos las rarezas reales de TCGplayer con su precio;
// solo si TCGplayer no tiene ese código (impresiones europeas antiguas, LOB-E001…) se queda el dato de YGOPRODeck.
function ygoVersions(c, pr){
  const ysets = c.card_sets || [];
  if (!pr) return ysets.map(s => ({ ...s }));
  const byCode = {};
  for (const e of pr.list) (byCode[normCode(e.c)] ||= []).push(e);
  const out = [], done = new Set();
  const addCode = (k, code, setName) => {
    done.add(k);
    // una versión por rareza y variante de arte (p. ej. RA04-EN106 Dark Magician: Arkana, 6th Art, 7th Art…)
    const byR = {};
    for (const e of byCode[k]) (byR[(e.r || '—') + '|' + (e.v || '')] ||= []).push(e);
    const hasOF = byCode[k].some(e => /extended art/i.test(e.v || ''));
    for (const [key, prints] of Object.entries(byR)) { const [r, variant] = key.split('|');
      const ofx = (hasOF && /starlight|grand master/i.test(r) && !/extended art/i.test(variant)) || prints.some(e => e.of);
      out.push({ set_code: code, set_rarity: r, set_name: setName, prints, ...(variant ? { variant } : {}), ...(ofx ? { ofx: true } : {}) }); }
  };
  for (const s of ysets) {
    const k = normCode(s.set_code);
    if (done.has(k)) continue;
    if (byCode[k]) addCode(k, s.set_code, s.set_name);
    else out.push({ ...s, set_rarity: /^(\d+|New|New artwork|Reprint|European.*)$/i.test(s.set_rarity) ? '—' : s.set_rarity, prints: [], noTcg: true }); // rarezas de YGOPRODeck que no son rarezas
  }
  // impresiones que TCGplayer tiene y YGOPRODeck no
  for (const k of Object.keys(byCode)) if (!done.has(k)) {
    const e = byCode[k][0];
    addCode(k, e.c, e.g.replace(/\s*\((Worldwide English|25th Anniversary Edition)\)/i, ''));
  }
  return out;
}
const versionPrice = s => { const v = (s?.prints || []).map(printPrice).filter(Boolean); return v.length ? Math.min(...v) : null; };
// Precio a mostrar: Cardmarket (€) si lo hay; si no, TCGplayer ($). { t: texto, n: número aprox. en € para ordenar }
const shownPrice = prints => {
  // Grand Master Rare: si el € de Cardmarket no se parece al $ de TCGplayer, era el precio de otra versión
  const okE = x => { if (!x.e || !isGMR(x.r)) return !!x.e; const u = printPrice(x); return !u || (x.e / u <= 3 && x.e / u >= 0.2); };
  const e = (prints || []).filter(okE).map(x => x.e);
  if (e.length) { const v = Math.min(...e); return { t: ((prints || []).some(x => x.ea) ? '~' : '') + eur(v), n: v, e: true }; }
  const u = (prints || []).map(printPrice).filter(Boolean);
  return u.length ? { t: usd(Math.min(...u)), n: Math.min(...u) * 0.92 } : null;
};
// impresiones de TCGplayer con ese código y rareza
function printsFor(pr, s){
  if (s?.prints) return s.prints;
  if (!pr || !s) return [];
  const same = pr.list.filter(e => normCode(e.c) === normCode(s.set_code));
  const r = same.filter(e => e.r.toLowerCase() === String(s.set_rarity).toLowerCase());
  return r.length ? r : (same.length && new Set(same.map(e => e.r)).size === 1 ? same : []);
}
// precio de mercado más bajo entre sus ediciones (1st Edition, Unlimited…)
// (si el mínimo es muchísimo mayor que el de mercado, el de mercado es un error: pasa con las Grand Master Rare)
const printPrice = e => { const v = Object.values(e?.p || {}).map(([m, l]) => m && l && l > m * 5 ? l : m || l).filter(Boolean); return v.length ? Math.min(...v) : null; };
const is25 = e => /25th Anniversary/i.test(e?.g || '');
const ED_TCG = { '1st Edition': '1ª edición', 'Unlimited': 'Edición ilimitada', 'Limited': 'Edición limitada' };

// local = { lang, code? }: la carta se buscó en otro idioma (código LOB-DE001 o nombre en alemán…)
async function openYugioh(c, code, rarity, local = null, variant = null){
  const sets = c.card_sets || [];
  const names = withTimeout(ygoLocalNames(c.name), 4000);
  // escaneos reales de todas las impresiones de la carta (una sola consulta) + precios por impresión
  const [scans0, pr] = await Promise.all([withTimeout(ygpScans(c.name), 4000), withTimeout(ygoPrints(c.name), 4000)]);
  const scans = scans0 || [];
  const real = s => s && pickScan(scans, s.set_code, s.set_rarity, isOF(s));
  const vers = ygoVersions(c, pr);
  const items = vers.length ? vers : [null];
  // primero la edición buscada (por código; la rareza de YGOPRODeck puede no coincidir con la real)
  const cc = code && normCode(code);
  // desde la colección: abre exactamente la versión guardada (p. ej. la Overframe y no la normal)
  const want = pendingLabel; pendingLabel = null;
  let idx = want ? items.findIndex(s => s && ygoLabelOf(s).toUpperCase() === String(want).toUpperCase()) : -1;
  if (idx < 0 && cc) idx = items.findIndex(s => s && normCode(s.set_code) === cc && (!rarity || s.set_rarity === rarity) && (!variant || s.variant === variant));
  if (idx < 0 && cc) idx = items.findIndex(s => s && normCode(s.set_code) === cc && (!rarity || s.set_rarity === rarity));
  if (idx < 0 && cc) idx = items.findIndex(s => s && normCode(s.set_code) === cc);
  const locNames = await names;
  // código en el idioma de la carta para la versión buscada (LOB-EN001 -> LOB-DE001)
  const locCode = s => local?.code && s && normCode(s.set_code) === cc ? local.code : null;
  const realLoc = s => { const lc = locCode(s); return (lc && pickScan(scans, lc, s.set_rarity, isOF(s))) || real(s); };
  return showVersions(items, idx < 0 ? 0 : idx, async s => yugiohView(c, s, realLoc(s) || (!s && pickScan(scans, null, null)),
      s && !locCode(s) ? scanGroup(scans, s.set_code, s.set_rarity, isOF(s)) : [], pr, { names: locNames, lang: local?.lang, code: locCode(s) }),
    s => { const x = real(s); const i = x ? ygpThumb(x.url) : c.card_images?.[0]?.image_url_small;
      return s ? { r: s.set_rarity, of: isOF(s), gmr: isGMR(s), str: isStR(s), st: isStamp(s), t: s.set_code + (s.variant ? ' · ' + s.variant : ''), p: s.prints?.length ? (shownPrice(s.prints)?.t || '') : (Number(s.set_price) ? '≈ ' + usd(s.set_price) : ''), i, rep: !x } : { r: '', t: c.name, i, rep: !x }; });
}

function yugiohView(c, set, scan, group = [], pr = null, loc = {}){
  const p = c.card_prices?.[0] || {};
  const rows = [];
  // idioma a destacar: el de la búsqueda o, si no, el de la web
  const showLang = loc.lang || (YLANGS[LANG] ? LANG : null);
  const locName = showLang && loc.names?.[showLang];
  const ps = printsFor(pr, set);
  // con varias impresiones del mismo código, la foto elegida decide cuál es "la tuya"
  const alts = group.length > 1 ? group.map(x => ({ url: x.url, label: scanLabel(x), file: x.file, is25: x.extra.includes('25thAnniversaryEdition') })) : null;
  const pick = a => ps.length > 1 && a ? (ps.find(e => is25(e) === a.is25) || null) : ps[0] || null;
  if (alts) alts.forEach(a => { const e = pick(a); a.pv = e ? shownPrice([e])?.t || null : null; });
  const chosen = ps.length > 1 ? pick(alts?.[0]) : ps[0];
  if (set && ps.some(e => e.e)) {
    rows.push(['#Esta edición (Cardmarket)']);
    for (const e of ps) if (e.e) rows.push([[set.set_code, ps.length > 1 ? (is25(e) ? T('25 aniversario') : e.g) : '', T('Tendencia')].filter(Boolean).join(' · '),
      eur(e.e) + (e.el ? ` <small>(${T('desde')} ${eur(e.el)}${e.e30 ? ` · ${T('media 30 días')} ${eur(e.e30)}` : ''})</small>` : '')]);
  }
  if (set && ps.length) {
    rows.push(['#Esta edición (TCGplayer)']);
    for (const e of ps) for (const [ed, [m, low]] of Object.entries(e.p))
      rows.push([[set.set_code, ps.length > 1 ? (is25(e) ? T('25 aniversario') : e.g) : '', T(ED_TCG[ed] || ed)].filter(Boolean).join(' · '),
        usd(m || low) + (low && m ? ` <small>(${T('desde')} ${usd(low)})</small>` : '')]);
  } else if (set && Number(set.set_price)) rows.push(['#Esta edición'], [`${set.set_code} (${set.set_rarity}) · YGOPRODeck`, usd(set.set_price)]);
  if (set?.ocg) {
    rows.push(['#Carta {0} (OCG)'.replace('{0}', OCG_REG[set.ocg] || set.ocg)], [T('Expansión'), esc(set.set_name)], [T('Código'), esc(set.set_code)]);
  }
  if (set?.ygp) rows.push(['#Esta impresión'], [T('Expansión'), esc(set.set_name)], [T('Código'), esc(set.set_code)]);
  if (set?.ocg || set?.ygp) {
    if (loc.ocgRef) rows.push([T('Referencia: versión inglesa {0}', loc.ocgRef.label), loc.ocgRef.price + ` <small>(${T(set.ocg ? 'no es el precio de la japonesa' : 'no es el precio de esta impresión')})</small>`]);
  }
  if (loc.code) rows.push(['#Tu carta'], [`${loc.code} (${T(YLANGS[loc.lang][1])})`, `<small>${T('TCGplayer solo vende cartas en inglés: el precio es el de {0}. Para tu idioma, mira Cardmarket.', esc(set.set_code))}</small>`]);
  if (loc.names && Object.values(loc.names).some(Boolean)) {
    rows.push(['#Nombre en otros idiomas']);
    for (const [k, l] of Object.entries(YLANGS)) if (loc.names[k]) { const t = T(l[1]); rows.push([`${l[2]} ${t[0].toUpperCase() + t.slice(1)}`, esc(loc.names[k])]); }
  }
  rows.push(['#Precio general de la carta'],
    ['Cardmarket (la edición más barata)', eur(p.cardmarket_price)], ['TCGplayer', usd(p.tcgplayer_price)],
    ['eBay', usd(p.ebay_price)], ['Amazon', usd(p.amazon_price)], ['CoolStuffInc', usd(p.coolstuffinc_price)]);
  const sp = chosen ? printPrice(chosen) : null;
  let se = chosen?.e || null; // Cardmarket manda
  if (se && isGMR(set) && sp && (se / sp > 3 || se / sp < 0.2)) se = null; // emparejamiento dudoso con otra versión
  const approx = !sp && set && Number(set.set_price) ? Number(set.set_price) : null; // TCGplayer no la vende: dato orientativo
  const jy = set?.ocg && loc.jp?.length ? Math.min(...loc.jp.map(x => x.y)) : null; // precio en Japón (yenes)
  if (jy) { rows.unshift(['#Precio en Japón (Yuyu-tei)'], ...loc.jp.map(x => [`${esc(x.r)} · ${esc(x.n)}`, yen(x.y) + (jpStock(x.s) ? ` <small>(${jpStock(x.s)})</small>` : '')]),
    [T('En euros'), '≈ ' + fmtMoney(jy * FX.JPY, 'EUR', 2)], [T('En dólares'), '≈ ' + fmtMoney(jy * FX.JPY / FX.USD, 'USD', 2)]); }
  return {
    gmr: isGMR(set), str: isStR(set), stamp: isStamp(set) ? stampName(set.set_name) : '', overframe: isOF(set), ofNoScan: isOF(set) && !set.ocg && !!scan && !scan.extra?.includes('EA'),
    img: scan?.url || c.card_images?.[0]?.image_url, replica: !scan, name: locName || c.name, subname: locName && locName !== c.name ? c.name : '', rarity: set?.set_rarity,
    alts,
    updated: jy ? T('Yuyu-tei del {0}', fecha(loc.jpUpd)) : pr && ps.length ? T(se ? 'Cardmarket del {0}' : 'TCGplayer del {0}', fecha(pr.updated)) : '',
    versionLabel: set ? `${loc.code || set.set_code} · ${set.set_rarity}${set.variant ? ' · ' + set.variant : ''}` : '',
    meta: set ? `${esc(set.set_name)} · ${esc(loc.code || set.set_code)}${set.variant ? ' · ' + esc(ofText(set.variant)) : ''}${set.ofx ? ' · Overframe' : ''}` : esc(c.type),
    mainLabel: jy ? 'Precio en Japón (Yuyu-tei)' : set?.ocg || set?.ygp ? 'Precio de esta edición exacta' : se ? 'Precio en Cardmarket de esta edición' : sp ? 'Precio de esta edición exacta' : approx ? 'Precio orientativo de esta edición' : set ? 'Precio de esta edición exacta' : 'Precio en Cardmarket (desde)',
    mainValue: jy ? yen(jy) : se ? eur(se) : sp ? usd(sp) : approx ? usd(approx) : set ? '' : eur(p.cardmarket_price) || usd(p.tcgplayer_price),
    approx: jy ? `≈ ${fmtMoney(jy * FX.JPY, 'EUR', 2)} · ≈ ${fmtMoney(jy * FX.JPY / FX.USD, 'USD', 2)} · ${T('precio de venta en la tienda japonesa Yuyu-tei, al cambio de hoy')}`
      : set?.ygp ? 'Esta impresión no está a la venta con este código en TCGplayer ni en Cardmarket: no hay precio público. Abajo tienes el precio de la misma carta en otra edición como referencia.'
      : set?.ocg ? 'Cardmarket y TCGplayer no venden cartas del OCG (Japón y Asia): no hay precio público de esta impresión. Abajo tienes el precio de la versión inglesa como referencia y enlaces a tiendas japonesas.'
      : se && chosen.ea ? 'Cardmarket no separa bien las versiones de esta carta en esta expansión: precio aproximado.' : approx ? 'TCGplayer no vende esta impresión; dato de YGOPRODeck, puede estar desactualizado.' : set && !sp ? 'TCGplayer no tiene precio de esta impresión ahora mismo.' : '',
    value: jy ? jy : set?.ocg || set?.ygp ? null : se || sp || approx || Number(p.cardmarket_price) || null,
    rows,
    links: [['Cardmarket', `https://www.cardmarket.com/es/YuGiOh/Products/Search?searchString=${encodeURIComponent(c.name)}${loc.lang ? '&language=' + ({ fr: 2, de: 3, es: 4, it: 5, pt: 8 })[loc.lang] : ''}`],

            ...(set?.ocg === 'JP' ? [['Yuyu-tei (Japón)', `https://yuyu-tei.jp/sell/ygo/s/search?search_word=${encodeURIComponent(set.set_code)}`],
              ['Mercari (Japón)', `https://jp.mercari.com/search?keyword=${encodeURIComponent(set.set_code)}`]] : []),
            ...(set?.ocg ? [['Lista de la expansión (Yugipedia)', `https://yugipedia.com/wiki/Special:Search?search=${encodeURIComponent(set.set_code)}`]] : []),
            ['Ficha', c.ygoprodeck_url], ['Foto (Yugipedia)', scan ? `https://yugipedia.com/wiki/File:${encodeURIComponent(scan.file)}` : null]],
    reload: async () => { const n = (await getJSON(`${YGO}/cardinfo.php?id=${c.id}`))?.data?.[0]; if (n) { Object.assign(c, n); drawCurrent(); } },
    openSet: set && !set.ocg && !set.ygp ? () => openYugiohSet(set.set_name) : null,
    howto: async () => {
      // texto de la carta en francés, alemán o italiano si YGOPRODeck lo tiene

async function openYugiohSet(name, only = ''){

  const prs = {};
  await withTimeout(Promise.all([...new Set(cards.map(c => c.name))].map(async n => { prs[n] = await ygoPrints(n); })), 6000);
  const items = [];
  for (const c of cards) {
    const codes = new Set((c.card_sets || []).filter(s => s.set_name === name).map(s => normCode(s.set_code)));
    for (const s of ygoVersions(c, prs[c.name])) if (codes.has(normCode(s.set_code))) {
      const sh = s.prints ? shownPrice(s.prints) : null;
      const v = s.prints ? sh?.n ?? null : Number(s.set_price) || null;
      items.push({
    img: c.card_images?.[0]?.image_url_small, title: c.name, sub: `${s.set_code} · ${isGMR(s) ? '🏆 ' : isStR(s) ? '✨ ' : ''}${s.set_rarity}${s.variant ? ' · ' + (isStamp(s) ? '🏅 ' : isOF(s) ? '🖼️ ' : '') + ofText(s.variant) : ''}${s.ofx ? ' · 🖼️ Overframe' : ''}`,
    tags: tileTags(isOF(s), isGMR(s), isStR(s), isStamp(s)), st: isStamp(s), of: isOF(s),
    col: () => ygoColCard(c, s),
    real: () => ygoRealImg(c, s.set_code, s.set_rarity, true, isOF(s)),
    price: sh ? sh.t : v ? '≈ ' + usd(v) : '', v, code: s.set_code,
    open: () => openYugioh(c, s.set_code.toUpperCase(), s.set_rarity, null, s.variant) });
    }
  }
  // completa con la lista de Yugipedia las cartas que YGOPRODeck no tiene (p. ej. los 3 Dioses de la Legendary Collection)
  const prefix = (items[0]?.code || '').split('-')[0] || (((await ygoSetList) || []).find(x => x.set_name === name)?.set_code) || '';
  if (prefix) {
    const have = new Set(items.map(i => normCode(i.code)));
    const miss = ((await withTimeout(ygpSetEntries(prefix, name), 6000)) || []).filter(h => !have.has(normCode(h.code)));
    const cs = await withTimeout(Promise.all(miss.map(h => ygoCardByName(h.name))), 6000) || [];
    for (const [k, h] of miss.entries()) {
      const c = cs[k];
      const vs = c ? ygoVersions(c, await withTimeout(ygoPrints(c.name), 3000)).filter(s => normCode(s.set_code) === normCode(h.code)) : [];
      if (vs.length) for (const s of vs) { const sh = s.prints?.length ? shownPrice(s.prints) : null;
        items.push({ img: c.card_images?.[0]?.image_url_small, title: c.name, sub: `${s.set_code} · ${s.set_rarity}${isOF(s) ? ' · 🖼️ Overframe' : ''}`,
          real: () => ygoRealImg(c, s.set_code, s.set_rarity, true, isOF(s)), price: sh ? sh.t : '', v: sh?.n ?? null, code: s.set_code,
          open: () => openYugioh(c, s.set_code.toUpperCase(), s.set_rarity, null, s.variant) }); }
      else items.push({ img: c?.card_images?.[0]?.image_url_small || '', title: h.name, sub: `${h.code} · ${h.rs.join(', ')}${h.ea ? ' · 🖼️ Overframe' : ''}`,
        real: c ? () => ygoRealImg(c, h.code, h.rs[0], true, h.ea) : undefined, price: '', v: null, code: h.code,
        open: () => searchYugiohOCG(h.code) });
    }
  }
  items.sort((a, b) => a.code.localeCompare(b.code, 'en', { numeric: true }));
  // solo un mazo del producto (LDK2-ENY…)
  if (only) { const o = normCode(only), sub = items.filter(i => normCode(i.code).startsWith(o)); if (sub.length) { items.length = 0; items.push(...sub); name = `${name} · ${only}`; } }
  const chips = [];
  if (items.some(i => i.st)) chips.push({ t: `🏅 ${T('Solo con sello')}`, f: i => i.st }, { t: T('Sin sello'), f: i => !i.st });
  if (items.some(i => i.of)) chips.push({ t: '🖼️ ' + T('Solo Overframe'), f: i => i.of });
  const tag = (items[0]?.code || '').split('-')[0];
  renderGrid(`${esc(name)} · ${T('{0} cartas', items.length)}`, items, { sort: true, chips, addAll: tag });
}

const MTG = 'https://api.scryfall.com';
async function searchMagic(q){
  const m = q.match(/^([a-z0-9]{2,6})\s*[\s\-\/#]\s*([0-9a-z★]+)$/i);
  if (m) {
    const c = await getJSON(`${MTG}/cards/${m[1].toLowerCase()}/${m[2].toLowerCase()}`);
    if (c) return openMagic(c);
  }
  const r = await getJSON(`${MTG}/cards/search?order=name&q=${encodeURIComponent(q)}`);
  const cards = r?.data || [];
  if (!cards.length) return error(T('No encontré esa carta. Revisa el código (ej. MH3 123) o el nombre en inglés.'));
  if (cards.length === 1) return openMagic(cards[0]);
  renderGrid(T('{0} resultados', cards.length), cards.slice(0, 80).map(c => ({
    img: mtgImg(c, 'small'), title: c.name, price: eur(c.prices?.eur) || usd(c.prices?.usd), open: () => openMagic(c) })));
}
const mtgImg = (c, size) => c.image_uris?.[size] || c.card_faces?.[0]?.image_uris?.[size];

async function openMagic(c){
  let prints = [c];
  try {
    const r = await getJSON(c.prints_search_uri);
    if (r?.data?.length) prints = r.data;
  } catch (e) {}
  const idx = prints.findIndex(p => p.id === c.id);
  return showVersions(prints, idx < 0 ? 0 : idx, async p => magicView(p),
    p => ({ r: p.rarity, t: `${p.set_name} · ${p.collector_number}`, p: eur(p.prices?.eur) || usd(p.prices?.usd), i: mtgImg(p, 'small') }));
}

function magicView(c){
  const p = c.prices || {};
  const main = Number(p.eur) || Number(p.usd) || Number(p.eur_foil) || Number(p.usd_foil) || null;
  return {
    img: mtgImg(c, 'normal'), name: c.name, rarity: c.rarity,
    versionLabel: `${c.set_name} · ${c.collector_number}`,
    meta: `${esc(c.set_name)} · ${esc(c.set.toUpperCase())} ${esc(c.collector_number)}`,
    mainLabel: p.eur ? 'Precio en Cardmarket' : 'Precio de referencia',
    mainValue: eur(p.eur) || usd(p.usd) || eur(p.eur_foil) || usd(p.usd_foil), value: main,
    rows: [['#Cardmarket (Europa)'], ['Normal', eur(p.eur)], ['Foil', eur(p.eur_foil)],
           ['#TCGplayer (EE. UU.)'], ['Normal', usd(p.usd)], ['Foil', usd(p.usd_foil)], ['Etched', usd(p.usd_etched)]],
    links: [['Cardmarket', c.purchase_uris?.cardmarket], ['TCGplayer', c.purchase_uris?.tcgplayer], ['Scryfall', c.scryfall_uri]],
    reload: async () => { const n = await getJSON(`${MTG}/cards/${c.id}`); if (n) { Object.assign(c, n); drawCurrent(); } },
    openSet: () => openMagicSet(c.set, c.set_name),
    howto: () => howtoMagic(c),
  };
}

async function openMagicSet(code, name){
  loading(T('Cargando la expansión…'));
  let url = `${MTG}/cards/search?order=set&unique=prints&q=${encodeURIComponent('e:' + code)}`, cards = [];
  for (let page = 0; url && page < 4; page++) {
    const r = await getJSON(url); if (!r) break;
    cards.push(...r.data); url = r.has_more ? r.next_page : null;
  }
  if (!cards.length) return error(T('No se pudo cargar la expansión.'));
  renderGrid(`${esc(name)} · ${T('{0} cartas', cards.length)}`, cards.map(c => ({
    img: mtgImg(c, 'small'), title: c.name, sub: `Nº ${c.collector_number} · ${c.rarity}`,
    price: eur(c.prices?.eur) || usd(c.prices?.usd), v: Number(c.prices?.eur) || Number(c.prices?.usd) || null,
    open: () => openMagic(c) })), { sort: true });
}

// =====================================================================
//  JUEGOS CON DATOS DIARIOS (One Piece, Dragon Ball, Digimon, Lorcana,
//  Gundam, Riftbound, Weiß Schwarz, WoW)
//  Fichero data/<juego>.json, lo actualiza cada día la GitHub Action.
// =====================================================================
const localData = {};
async function loadLocal(key){
  if (localData[key]) return localData[key];
  const r = await fetch(`data/${key}.json`);
  if (!r.ok) throw new Error('Sin datos');
  const d = await r.json();
  d.byCode = {};
  for (const c of d.cards) {
    c.k = normCode(c.c);              // código completo
    c.k1 = d.currency === 'JPY' ? '' : normCode(String(c.c).split(' ')[0]); // sin la rareza (Digimon: "BT1-084 SR")
    c.nn = normName(c.n);
    c.b = normName(c.n.replace(/\(.*?\)|\[.*?\]/g, '')).trim(); // nombre sin "(Alternate Art)"…
    for (const k of new Set([c.k, c.k1])) if (k) (d.byCode[k] ||= []).push(c);
    if (c.b) (d.byB ||= {})[c.b] ? d.byB[c.b].push(c) : (d.byB[c.b] = [c]);
  }
  return (localData[key] = d);
}
// Foto: TCGplayer. TCGplayer no tiene foto de algunos productos (promos, cartas de presentación…):
// entonces se prueba con otra versión de la misma carta (mismo código) y, en Digimon y One Piece, con su base de datos por código.
// Weiß Schwarz: la misma carta en la web oficial japonesa (KC/SE28-E01 -> kc_se28_01)
function wsJp(code){
  const m = String(code).match(/^([A-Z0-9]+)\/([A-Z0-9]+)-([A-Z]*?)(\d+[A-Z]*)$/i); if (!m) return '';
  const pre = m[3].toUpperCase().replace(/E$/, ''), a = m[1].toLowerCase(), b = m[2].toLowerCase();
  return `https://ws-tcg.com/wordpress/wp-content/images/cardlist/${a[0]}/${a}_${b}/${a}_${b}_${(pre + m[4]).toLowerCase()}.png`;
}
const tcgUrl = (id, big) => `https://tcgplayer-cdn.tcgplayer.com/product/${id}_${big ? 'in_1000x1000' : '200w'}.jpg`;
const tcgImg = (c, big, key = game) => {
  const d = localData[key];
  // Duel Masters: Torekakaku; si no tiene la foto, la de otra impresión de la misma carta (mismo nombre)
  if (c.y !== undefined) return withAlts([`https://torekakaku.com/dm/image/${c.id}.jpg`,
    ...(c.b && d?.byB?.[c.b] ? d.byB[c.b].filter(x => x !== c && x.id).slice(-3).map(x => `https://torekakaku.com/dm/image/${x.id}.jpg#pcother`) : [])]);
  const code = String(c.c || '').split(' ')[0];
  const sibs = c.k1 && d?.byCode?.[c.k1] ? d.byCode[c.k1].filter(x => x !== c && x.b === c.b && x.id).slice(0, 2).map(x => tcgUrl(x.id, big)) : [];
  const own = code && key === 'digimon' ? [`https://images.digimoncard.io/images/cards/${code}.jpg`]
    : code && key === 'onepiece' ? [`https://optcgapi.com/media/static/Card_Images/${code}.jpg`, `${LIMITLESS.replace('tpci/', 'one-piece/')}${code.split('-')[0]}/${code}_EN.webp#pcsample`]
    : code && key === 'weiss' ? [wsJp(code)] : [];
  // último recurso: la misma carta (mismo nombre) de otra expansión o edición, marcada como «otra edición»
  const other = c.b && d?.byB?.[c.b] ? d.byB[c.b].filter(x => x !== c && x.id && (x.k1 !== c.k1 || !c.k1)).slice(-2).map(x => tcgUrl(x.id, big) + '#pcother') : [];
  return withAlts([tcgUrl(c.id, big), ...sibs, ...own, ...other]);
};
const yen = v => money(v, 'JPY', 0);
// Rareza + tipo de versión sacado del nombre: "SEC · Alt Art", "SEC · Manga", "SR · Parallel"…
const localRarity = c => {
  const tags = [...String(c.n).matchAll(/[(\[]([^)\]]+)[)\]]/g)].map(m => m[1].trim())
    .filter(t => normCode(t) !== c.k1 && normCode(t) !== c.k && !/^[\d\s]+$/.test(t))
    .map(t => t.replace(/Alternate Art/i, 'Alt Art'));
  return [c.r, ...tags].filter(Boolean).join(' · ');
};
const localValue = c => c.y || c.e || c.u || null;
const localPrice = c => c.y !== undefined ? yen(c.y) : eur(c.e) || usd(c.u);

async function searchLocal(q){
  loading(T('Cargando datos del juego…'));
  const d = await loadLocal(game).catch(() => null);
  if (!d) return error(T('Los datos de este juego aún no están listos. Vuelve a intentarlo en unos minutos.'));
  const k = normCode(q);
  let found = d.byCode[k] || [];
  if (!found.length && /\d/.test(q)) {                 // código parcial: "OP01-12" -> empieza por
    found = d.cards.filter(c => c.k.startsWith(k) || c.k1.startsWith(k));
    if (found.length > 1 && new Set(found.map(c => c.k1)).size > 1) {
      return gridLocal(T('{0} cartas', found.length), found);
    }
  }
  if (found.length) {
    if (new Set(found.map(c => c.b)).size > 1) return gridLocal(T('{0} cartas con ese código', found.length), found);
    const v = sameCard(d, found[0]); return openLocal(v[0], v); // empieza por la versión normal
  }
  const words = normName(q).split(/\s+/).filter(Boolean);
  const byName = d.cards.filter(c => words.every(w => c.nn.includes(w)));
  if (!byName.length) return error(T('No encontré esa carta. Revisa el código o escribe el nombre en inglés.'));
  // agrupa las versiones de la misma carta y muestra una por grupo
  const groups = {};
  for (const c of byName) (groups[c.k1 + '|' + c.b] ||= []).push(c);
  const reps = Object.values(groups).map(g => g.sort((a, b) => (localValue(a) ?? 1e9) - (localValue(b) ?? 1e9))[0]);
  if (reps.length === 1) return openLocal(reps[0], sameCard(d, reps[0]));
  gridLocal(T('{0} resultados', reps.length), reps);
}

// Todas las versiones (rarezas, paralelas, alt art…) de la misma carta
function sameCard(d, c){
  const list = c.k1 ? d.byCode[c.k1].filter(x => x.b === c.b) : d.cards.filter(x => x.b === c.b);
  return [...new Set(list)].sort((a, b) => (localValue(a) ?? 1e9) - (localValue(b) ?? 1e9));
}

function gridLocal(title, cards, opts){
  const d = localData[game];
  renderGrid(title, cards.slice(0, 300).map(c => ({
    img: tcgImg(c), title: c.n, sub: [c.c, c.r].filter(Boolean).join(' · '),
    price: localPrice(c), v: localValue(c),
    open: () => openLocal(c, sameCard(d, c)) })), opts);
}

function openLocal(c, versions){
  const key = game;
  const idx = versions.indexOf(c);
  return showVersions(versions, idx < 0 ? 0 : idx, async x => localView(key, x),
    x => ({ r: localRarity(x), t: x.c || x.n, p: localPrice(x), i: tcgImg(x) }));
}

function localView(key, c){
  const d = localData[key], g = GAMES[key], set = d.sets[c.g] || {};
  if (g.yen) return dmView(key, c, d, set);
  const rows = [['#Cardmarket (Europa)'],
    ['Tendencia', eur(c.e)], ['Desde', eur(c.el)], ['Media 30 días', eur(c.e30)], ['Foil (tendencia)', eur(c.ef)],
    ['#TCGplayer (EE. UU.)'], ['Precio de mercado', usd(c.u)], ['Desde', usd(c.ul)], ['Foil', usd(c.uf)]];
  const cmLink = c.cm
    ? `https://www.cardmarket.com/es/${g.cm}/Products?idProduct=${c.cm}`
    : `https://www.cardmarket.com/es/${g.cm}/Products/Search?searchString=${encodeURIComponent(c.n.replace(/\(.*?\)/g, '').trim())}`;
  return {
    img: tcgImg(c, true), name: c.n, rarity: localRarity(c),
    versionLabel: [localRarity(c), c.c].filter(Boolean).join(' · '),
    meta: `${esc(set.n || '')}${c.c ? ' · ' + esc(c.c) : ''}`,
    mainLabel: c.e ? 'Precio de tendencia en Cardmarket' : 'Precio de mercado en TCGplayer',
    mainValue: localPrice(c), value: localValue(c),
    approx: c.e && c.ea ? '≈ Esta carta tiene varias versiones: comprueba en Cardmarket que sea la tuya.' : '',
    rows,
    links: [['Cardmarket', cmLink], ['TCGplayer', `https://www.tcgplayer.com/product/${c.id}`]],
    howto: () => howtoLocal(key, c),
    updated: c.e ? T('Cardmarket del {0}', fecha(d.cmUpdated || d.updated)) : T('TCGplayer del {0}', fecha(d.updated)),
    openSet: () => {
      const list = d.cards.filter(x => x.g === c.g)
        .sort((a, b) => String(a.c).localeCompare(String(b.c), 'en', { numeric: true }));
      gridLocal(`${esc(set.n || T('Expansión'))} · ${T('{0} cartas', list.length)}`, list, { sort: true });
    },
  };
}

// Duel Masters: precios de Japón en yenes (Torekakaku)

// =====================================================================
//  CAJAS SELLADAS (booster box, ETB, sobres, mazos…) — data/sealed/<juego>.json
// =====================================================================
const SEALED_TYPES = { box: '📦 Cajas de sobres', etb: '🎁 Elite Trainer Box', case: '🗃️ Cajas máster (case)',
  pack: '🃏 Sobres', tin: '🥫 Tins', cbox: '🎁 Cajas de colección', deck: '🂠 Mazos', coll: '🎀 Colecciones y packs', other: '➕ Otros' };
const sealedData = {};
async function showSealed(key){
  loading(T('Cargando productos sellados…'));
  if (!sealedData[key]) {
    const r = await fetch(`data/sealed/${key}.json`).catch(() => null);
    if (!r || !r.ok) return error(T('Los precios de productos sellados de este juego aún no están listos.'));
    sealedData[key] = await r.json();
    // separa Tins y cajas de colección por su nombre (los datos los agrupan en «colecciones» u «otros»)
    for (const i of sealedData[key].items) if (/^(coll|other)$/.test(i.t)) {
      if (/\b(mini )?tins?\b|\blata\b/i.test(i.n)) i.t = 'tin';
      else if (/collection box|premium collection|collection chest|special collection|ultra.?premium|box set|colecci[oó]n especial/i.test(i.n)) i.t = 'cbox';
    }
  }
  const d = sealedData[key];
  const types = Object.keys(SEALED_TYPES).filter(t => d.items.some(i => i.t === t));
  let type = types.includes('box') ? 'box' : types.includes('etb') ? 'etb' : 'all', q = '', sort = 'new', limit = 60;
  const val = i => i.e || i.u || null;
  // las colecciones "Miscellaneous" / promos no tienen fecha real: al final
  const setDate = i => /misc|promo|other/i.test(d.sets[i.g]?.n || '') ? '0' : String(d.sets[i.g]?.d || '');
  redraw = () => showSealed(key);
  const draw = () => {
    let list = d.items.filter(i => (type === 'all' || i.t === type) && (!q || normName(i.n + ' ' + (d.sets[i.g]?.n || '')).includes(q)));
    list.sort(sort === 'hi' ? (a, b) => (val(b) ?? -1) - (val(a) ?? -1)
      : sort === 'lo' ? (a, b) => (val(a) ?? 1e9) - (val(b) ?? 1e9)
      : (a, b) => setDate(b).localeCompare(setDate(a)));
    out.innerHTML = `${backBtn()}
      <div class="bar"><h2>${T('📦 Productos sellados · {0}', esc(GAMES[key].label))}</h2>
        <select id="ssort"><option value="new">${T('Más nuevos primero')}</option><option value="hi">${T('Más caros primero')}</option><option value="lo">${T('Más baratos primero')}</option></select></div>
      <div class="sfilters">
        <button class="chip${type === 'all' ? ' on' : ''}" data-t="all">${T('Todo')}</button>
        ${types.map(t => `<button class="chip${type === t ? ' on' : ''}" data-t="${t}">${T(SEALED_TYPES[t])}</button>`).join('')}
      </div>
      <input class="sfind" id="sfind" placeholder="${T('Buscar por expansión o nombre (ej. 151, Romance Dawn…)')}" value="${esc(q)}">
      <p class="note">${T('{0} productos · Precios del {1} (Cardmarket €, si no TCGplayer $)', list.length, fecha(d.cmUpdated || d.updated))}</p>
      <div class="list">${list.slice(0, limit).map((i, k) => `<div class="item" data-k="${k}">
        <img src="${tcgImg(i)}" loading="lazy" alt="">
        <div>${esc(i.n)}</div><div class="note">${esc(d.sets[i.g]?.n || '')}</div>
        <div class="p">${eur(i.e) || usd(i.u) || '—'}</div></div>`).join('')}</div>
      ${list.length > limit ? `<button class="more" id="more">${T('Ver más')}</button>` : ''}`;
    wireBack();
    out.querySelectorAll('.sfilters .chip').forEach(b => b.onclick = () => { type = b.dataset.t; limit = 60; draw(); });
    $('ssort').value = sort; $('ssort').onchange = e => { sort = e.target.value; draw(); };
    const f = $('sfind');
    f.oninput = () => { clearTimeout(f._t); f._t = setTimeout(() => { q = normName(f.value.trim()); limit = 60; draw(); $('sfind').focus(); $('sfind').setSelectionRange(99, 99); }, 300); };
    if ($('more')) $('more').onclick = () => { limit += 60; draw(); };
    out.querySelectorAll('.item').forEach(el => el.onclick = () => {
      remember(draw);
      sealedView(key, list[el.dataset.k]);
    });
  };
  draw();
  toTop();
}

function sealedView(key, i){
  const d = sealedData[key], g = GAMES[key];
  current = null;

// Usa la cámara para hacer una foto del código y Tesseract.js para leer el texto.
let stream = null, ocrWorker = null;

async function openScan(){

// Recorta la zona del recuadro verde (mismas proporciones que en el CSS)
function cropGuide(src, w, h){
  if (!w) return null;
  return prep(src, w * .08, h * .38, w * .84, h * .24);
}
// Agranda la imagen y la pasa a blanco y negro con más contraste para leer mejor
function prep(src, x, y, w, h){
  const scale = Math.min(3, 2000 / w);
  const c = document.createElement('canvas');
  c.width = w * scale; c.height = h * scale;
  const g = c.getContext('2d');
  g.drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = 0.3 * d[i] + 0.59 * d[i + 1] + 0.11 * d[i + 2];
    d[i] = d[i + 1] = d[i + 2] = Math.max(0, Math.min(255, (v - 128) * 1.6 + 128));
  }
  g.putImageData(img, 0, 0);
  return c;
}
function loadScript(src){
  return new Promise((ok, fail) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
}
async function loadOCR(){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  ocrWorker = Tesseract.createWorker('eng').catch(e => { ocrWorker = null; throw e; });
  return ocrWorker;
}
async function readImage(canvas){
  if (!canvas) return setStatus(T('La cámara aún no está lista, espera un segundo.'));
  setStatus(T('Leyendo el código… ⏳'));
  try {
    const worker = await loadOCR();
    const { data } = await worker.recognize(canvas);
    const code = await extractCode(data.text);
    if (!code) return setStatus(T('No pude leer un código. Acerca más la cámara, con buena luz, y vuelve a intentarlo.'));
    closeScan();
    $('q').value = code;
    search();
  } catch (e) {
    console.error(e);
    setStatus(T('Error al leer la imagen. Inténtalo otra vez.'));
  }
}
// Corrige letras que el lector confunde con números (O→0, I→1…)
const digits = s => s.replace(/[OQD]/g, '0').replace(/[IL|]/g, '1').replace(/S/g, '5').replace(/B/g, '8').replace(/Z/g, '2');

async function extractCode(raw){
  const T = raw.toUpperCase().replace(/[–—_]/g, '-');
  let m;
  if (game === 'yugioh') {
    m = T.match(/\b([A-Z0-9]{2,5})\s*-\s*([A-Z0-9]{3,7})\b/);
    if (m) {
      const reg = (m[2].match(/^(EN|SP|DE|FR|IT|PT|JP|KR|AE|E|S|G|F|I|P)(?=[0-9OQDILSBZ]{3,})/) || [''])[0];
      const num = digits(m[2].slice(reg.length)).replace(/\D/g, '').slice(-3);
      if (num.length === 3) return `${m[1]}-${reg}${num}`;
    }
  }
  if (game === 'pokemon') {
    const num = T.match(/([0-9OIL]{1,3})\s*\/\s*([0-9OIL]{2,3})/);
    if (num) {
      const n = digits(num[1]).replace(/^0+(?=\d)/, ''), total = digits(num[2]).replace(/^0+(?=\d)/, '');
      const before = T.slice(Math.max(0, num.index - 20), num.index);
      for (const c of (before.match(/\b[A-Z]{3}\b/g) || []).reverse())
        if ((await pokemonSetIds(c).catch(() => [])).length) return `${c} ${n}`;
      return `${n}/${total}`;
    }
  }
  if (game === 'magic') {
    const num = T.match(/\b([0-9OIL]{1,4})(?:\s*\/\s*\d{2,4})?\s+[CURMLSTP]\b/);
    const set = T.match(/\b([A-Z0-9]{3,5})\s*[•·*.+]?\s*(?:EN|ES|DE|FR|IT|PT|JA)\b/);
    if (num && set) return `${set[1]} ${parseInt(digits(num[1]), 10)}`;
  }
  if (GAMES[game].type === 'local') {
    // Busca en el texto cualquier código que exista en los datos del juego (OP01-120, 207/204…)
    const d = await loadLocal(game).catch(() => null);
    if (!d) return null;
    const S = T.replace(/\s*([-\/])\s*/g, '$1');
    for (const tok of S.match(/[A-Z0-9]{1,8}(?:[-\/][A-Z0-9]{1,8})+/g) || []) {
      const parts = tok.split(/([-\/])/);
      const fixed = parts.map((p, i) => i === parts.length - 1 ? digits(p) : p).join(''); // el número final
      for (const t of [tok, fixed]) if (d.byCode[normCode(t)]) return d.byCode[normCode(t)][0].c.split(' ')[0];
    }
  }
  return null;
}

const weekKey = (d = new Date()) => { const m = new Date(d); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return dayKey(m); };
const ago = k => { const [y, m, d] = k.split('-').map(Number); return Math.round((new Date(dayKey()) - new Date(y, m - 1, d)) / 864e5); };

  const h = hist()[i.game + '|' + (i.name || '') + '|' + (i.label || '')];
  if (h && (!i.cur || h.c === i.cur)) for (const [d, v] of h.p) if (v > 0) m[d] = v;

// mini gráfica de tendencia (sparkline): pts = [[día, valor], …]
function sparkHTML(pts){
  if (!pts || pts.length < 2) return '';
  const vs = pts.slice(-30).map(p => p[1]), W = 80, H = 22;
  let mn = Math.min(...vs), mx = Math.max(...vs); if (mn === mx) { mn -= 1; mx += 1; }
  const d = vs.map((v, k) => `${k ? 'L' : 'M'}${(k / (vs.length - 1) * W).toFixed(1)},${(2 + (1 - (v - mn) / (mx - mn)) * (H - 4)).toFixed(1)}`).join(' ');
  const up = vs.at(-1) >= vs[0];
  return `<svg class="spark ${up ? 'up' : 'down'}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}"/></svg>`;
}

function countUp(el){
  if (!el) return;
  const cs = colSummary(), curs = Object.keys(cs.tot);
  if (curs.length !== 1) return;
  const c = curs[0], to = cs.tot[c], key = 'pc_hval_' + c;
  let from = 0; try { from = Number(sessionStorage.getItem(key)) || 0; sessionStorage.setItem(key, to); } catch (e) {}
  if (reduced || Math.abs(from - to) < 0.005) return;
  const t0 = performance.now(), dur = 900;
  (function f(t){ if (!el.isConnected) return;
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fm(from + (to - from) * e, c);
    if (k < 1) requestAnimationFrame(f); })(t0);
}
// pts = [{ l: etiqueta, v: número }]
function chartHTML(pts, cur){
  const W = 300, H = 120, vs = pts.map(p => p.v);
  let mn = Math.min(...vs), mx = Math.max(...vs); if (mn === mx) { mn = mn * .9; mx = mx * 1.1 || 1; }
  const X = i => pts.length === 1 ? W / 2 : i / (pts.length - 1) * W;
  const Y = v => 10 + (1 - (v - mn) / (mx - mn)) * (H - 20);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const gid = 'g' + Math.random().toString(36).slice(2, 7), dec = cur === 'JPY' ? 0 : 2;
  return `<div class="pchart" data-pts="${esc(JSON.stringify(pts))}" data-cur="${cur}" data-mn="${mn}" data-mx="${mx}">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".28"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
      <line class="gl" x1="0" x2="${W}" y1="10" y2="10"/><line class="gl" x1="0" x2="${W}" y1="${H - 10}" y2="${H - 10}"/>
      <path d="${d} L${X(pts.length - 1)},${H} L${X(0)},${H} Z" fill="url(#${gid})"/>
      <path class="ln" d="${d}"/></svg>
    <span class="pyr" style="top:0">${money(mx, cur, dec) || ''}</span><span class="pyr" style="bottom:22px">${money(mn, cur, dec) || ''}</span>
    <span class="pm"></span><span class="ptip"></span>
    <div class="paxis"><span>${esc(pts[0].l)}</span><span>${esc(pts.at(-1).l)}</span></div></div>`;
}
function chartMove(e){
  const ch = e.target.closest?.('.pchart'); if (!ch) return;
  const pts = JSON.parse(ch.dataset.pts), svg = ch.querySelector('svg'), r = svg.getBoundingClientRect();
  const x = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width;
  const i = Math.max(0, Math.min(pts.length - 1, Math.round(x * (pts.length - 1))));
  const mn = +ch.dataset.mn, mx = +ch.dataset.mx, cur = ch.dataset.cur;
  const px = pts.length === 1 ? r.width / 2 : i / (pts.length - 1) * r.width;

function record(id, value, cur, info = {}){
  const H = LS.get(HKEY, {});
  const h = Object.assign(H[id] || { c: cur, p: [] }, info);
  const k = dayKey(), last = h.p.at(-1);
  if (last && last[0] === k) last[1] = value; else h.p.push([k, value]);
  h.p = h.p.slice(-180); h.c = cur; h.t = Date.now(); H[id] = h;
  const ids = Object.keys(H);
  if (ids.length > 600) ids.sort((a, b) => H[a].t - H[b].t).slice(0, ids.length - 600).forEach(x => delete H[x]);
  LS.set(HKEY, H);
  return h;
}

function numOf(s){
  s = String(s).replace(/[^\d.,]/g, ''); if (!s) return NaN;
  const m = s.match(/[.,](\d{1,2})$/);
  return m ? Number(s.slice(0, m.index).replace(/[.,]/g, '') + '.' + m[1]) : Number(s.replace(/[.,]/g, ''));
}
function sections(rows){
  const out = []; let cur = null;
  for (const r of rows) {
    if (r[0].startsWith('#')) { cur = { name: r[0].slice(1), rows: [] }; out.push(cur); }
    else if (r[1]) { if (!cur) { cur = { name: '', rows: [] }; out.push(cur); } cur.rows.push(r); }
  }
  return out.filter(s => s.rows.length);
}

  let chg = '';
  if (histPts.length > 1) { const a = histPts[0].v, b = histPts.at(-1).v, pc = (b - a) / a * 100;
    chg = `<span class="${pc >= 0 ? 'up' : 'down'}">${pc >= 0 ? '▲' : '▼'} ${Math.abs(pc).toFixed(1)}%</span>`; }
  const evo = `<details class="fx" id="fxEvo"><summary>📈 ${T('Evolución del precio')} ${chg}</summary><div class="fxb">
    ${avgPts.length >= 2 ? `<p class="lbl2" style="margin:4px 0 0">${T('Medias de Cardmarket (datos de la fuente)')}</p>${chartHTML(avgPts, 'EUR')}` : ''}
    ${histPts.length >= 2 ? `<p class="lbl2" style="margin:12px 0 0">${T('Tu historial: un punto por cada día que consultas esta carta')}</p>${chartHTML(histPts, h.c)}`
      : `<p class="note">${T('Guardamos el precio real cada día que abres esta carta (en este dispositivo). Vuelve otro día y verás aquí su evolución.')}${histPts.length ? ' ' + T('Primer registro: {0}', histPts[0].l) : ''}</p>`}
    <p class="note">${T('No mostramos precios estimados ni inventados: solo datos de las fuentes y lo que ya has consultado.')}</p></div></details>`;

  // --- Comparador por plataforma ---
  const nm = v.name || '';
  const links = (v.links || []).filter(l => l[1]);
  const rowsCmp = [];
  const usedProv = new Set();
  for (const s of secs) {
    const prov = PROVIDERS.find(p => p[1].test(s.name)) || PROVIDERS.find(p => p[1].test(v.mainLabel || ''));
    const pname = prov ? prov[0] : (s.name || T('Fuente'));
    usedProv.add(pname);
    const head = s.rows.find(r => curOf(plain(r[1])));
    if (!head) { usedProv.delete(pname); continue; }   // secciones sin precio (p. ej. nombres en otros idiomas)
    const inPar = (s.name.match(/\(([^)]+)\)/) || [])[1] || '';
    const mk = [prov && new RegExp(prov[0], 'i').test(inPar) ? T(prov[2]) : (inPar || (prov ? T(prov[2]) : '')), s.name && !new RegExp('^' + pname + '$', 'i').test(s.name) ? T(s.name.replace(/\s*\([^)]*\)/, '')) : ''].filter(Boolean).join(' · ');
    const link = links.find(l => new RegExp(pname, 'i').test(l[0]))?.[1] || (prov?.[3] ? prov[3](nm) : '');
    const upd = v.updated && new RegExp(pname, 'i').test(plain(v.updated)) ? plain(v.updated) : '';
    rowsCmp.push(`<tr><td class="src">${esc(pname)}<small>${esc(mk)}${upd ? ' · ' + esc(upd) : ''}</small></td>
      <td><span class="pv">${head[1]}</span><small>${esc(T(head[0]))} · ${curOf(plain(head[1])) || '—'}</small></td>
      <td>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${T('Ver')} ↗</a>` : ''}</td></tr>`);
  }
  if (!secs.length && v.mainValue) {
    const prov = PROVIDERS.find(p => p[1].test(v.mainLabel || ''));
    if (prov) usedProv.add(prov[0]);
    rowsCmp.push(`<tr><td class="src">${esc(prov ? prov[0] : T(v.mainLabel))}<small>${esc(prov ? T(prov[2]) : '')}${v.updated ? ' · ' + esc(plain(v.updated)) : ''}</small></td>
      <td><span class="pv">${v.mainValue}</span><small>${cur || '—'}</small></td><td>${links[0] ? `<a href="${esc(links[0][1])}" target="_blank" rel="noopener">${T('Ver')} ↗</a>` : ''}</td></tr>`);
  }
  for (const p of PROVIDERS) if (p[3] && !usedProv.has(p[0]) && !(GAMES[game].yen && p[0] !== 'eBay'))
    rowsCmp.push(`<tr><td class="src">${p[0]}<small>${T(p[2])}</small></td><td><small>${T('Sin precio integrado: consúltalo en la fuente')}</small></td>
      <td><a href="${esc(p[3](nm))}" target="_blank" rel="noopener">${T('Buscar')} ↗</a></td></tr>`);
  const cmp = `<details class="fx" id="fxCmp"><summary>⚖️ ${T('Comparador de precios')}</summary><div class="fxb">
    <table class="cmp">${rowsCmp.join('')}</table>
    <p class="note">${T('Cada plataforma se muestra por separado, en su moneda y mercado. eBay y PriceCharting se abren en su web: no copiamos sus precios.')}</p></div></details>`;
  big.insertAdjacentHTML('afterend', evo + cmp);
  $('fxEvo').addEventListener('toggle', e => { if (e.target.open) track('chart'); });
  $('fxCmp').addEventListener('toggle', e => { if (e.target.open) track('compare'); });
  tilt(out.querySelector('.result .pic > img'));
}

// ---------------------------------------------------------------- EFECTO HOLOGRÁFICO 3D EN LA CARTA
// la imagen se inclina siguiendo el dedo o el ratón, con un brillo que se mueve como una carta foil
function tilt(img){
  if (!img || reduced || window.PC_BG || img.parentElement.classList.contains('tiltw')) return;
  const w = document.createElement('span'); w.className = 'tiltw';
  img.replaceWith(w); w.append(img); w.insertAdjacentHTML('beforeend', '<span class="holo"></span>');
  let raf = 0;
  const move = e => {
    const r = w.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => { w.style.setProperty('--rx', ((.5 - y) * 16).toFixed(2) + 'deg'); w.style.setProperty('--ry', ((x - .5) * 18).toFixed(2) + 'deg');
      w.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); w.style.setProperty('--my', (y * 100).toFixed(1) + '%'); w.classList.add('on'); });
  };
  const reset = () => { cancelAnimationFrame(raf); w.classList.remove('on'); w.style.removeProperty('--rx'); w.style.removeProperty('--ry'); };
  w.addEventListener('pointermove', move); w.addEventListener('pointerdown', move);
  w.addEventListener('pointerleave', reset); w.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') reset(); }); w.addEventListener('pointercancel', reset);
}

// ---------------------------------------------------------------- ENGANCHES CON LA APP
const _render = render;
render = function(v){ _render(v); try { afterRender(v); } catch (e) { console.error(e); } };
const _search = search;

if (typeof showCentering === 'function') { const _c = showCentering; showCentering = function(){ const r = _c.apply(this, arguments); track('center'); return r; }; }
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { if (S.on) { S.games[t.dataset.game] = 1; roll(); S.w.games[t.dataset.game] = 1; store(); } }));

// filtro rápido en rejillas de resultados (rareza, código, edición, idioma…)
let gq = '', gPrice = false;
function filterGrid(){

  out.querySelectorAll('.list .item').forEach(el => {

  const c = $('gcount'); if (c) c.textContent = T('{0} resultados', shown);
}
new MutationObserver(() => {
  const list = out.querySelector(':scope > .list'), bar = out.querySelector(':scope > .bar');
  if (!list || !bar || out.querySelector('.gfilter') || list.children.length < 6) return;
  bar.insertAdjacentHTML('afterend', `<div class="gfilter"><input id="gfq" placeholder="${T('Filtrar: rareza, código, edición, idioma…')}" value="${esc(gq)}">
    <button class="chip${gPrice ? ' on' : ''}" id="gfp">💶 ${T('Solo con precio')}</button><small class="note" id="gcount"></small></div>`);
  $('gfq').oninput = e => { gq = e.target.value; filterGrid(); };
  $('gfp').onclick = e => { gPrice = !gPrice; e.target.classList.toggle('on', gPrice); filterGrid(); };

$('form').addEventListener('submit', () => { gq = ''; });

drawHero();
// primera visita del día: suma a la racha (si la gamificación está activa)

<script>
// =====================================================================
//  APP MÁS DINÁMICA (noviembre 2026)
//  1) Actualización automática de precios: una vez al día, una copia invisible de la app (?bg=1)
//     vuelve a abrir cada carta de tu colección y favoritos con las mismas fuentes de siempre.
//     Así el historial, «Evolución del mercado» y los avisos se llenan solos. No se inventa nada.
//  2) Avisos del móvil (notificaciones) y app instalable (manifest + service worker)
//  3) Deslizar hacia abajo para refrescar
// =====================================================================
(function(){
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const waitFor = async (ok, ms) => { const t = Date.now(); while (!ok()) { if (Date.now() - t > ms) return false; await sleep(150); } return true; };
// el brillo de «cargando» de las imágenes se apaga cuando la imagen ya llegó (o falló)
const loaded = e => { if (e.target.tagName === 'IMG') e.target.classList.add('ld'); };
document.addEventListener('load', loaded, true); document.addEventListener('error', loaded, true);
const HERE = location.origin + location.pathname;   // ojo: <base> apunta a precio-cartas, por eso URLs absolutas

// ---------------------------------------------------------------- AVISOS
async function notify(title, body, tag){
  if (window.PC_BG || !('Notification' in window) || Notification.permission !== 'granted') return;
  const icon = location.origin + '/precio-telefono/icon-192.png';
  try { const reg = await navigator.serviceWorker?.getRegistration(HERE);
    if (reg) return await reg.showNotification(title, { body, icon, badge: icon, tag, data: { url: HERE } }); } catch (e) {}
  try { new Notification(title, { body, icon, tag }); } catch (e) {}
}
window.pcNotify = notify;

// ---------------------------------------------------------------- APP INSTALABLE
if (!window.PC_BG && 'serviceWorker' in navigator && location.protocol === 'https:')
  navigator.serviceWorker.register(location.pathname.replace(/[^/]*$/, '') + 'sw.js').catch(() => {});

// ---------------------------------------------------------------- COPIA INVISIBLE: actualiza cada carta
if (window.PC_BG) {
  const post = m => { try { parent.postMessage({ pcbg: 1, ...m }, location.origin); } catch (e) {} };
  let lastV = null;
  const _render = render;
  render = function(v){ lastV = v; return _render.apply(this, arguments); };
  const same = (v, i) => !!v && (v.name || '') === (i.name || '') && (v.versionLabel || '') === (i.label || '');
  async function one(i){
    if (!GAMES[i.game]) return false;
    if (game !== i.game) document.querySelector(`.tab[data-game="${i.game}"]`)?.click();
    $('q').value = i.q || i.name; lastV = null;
    await Promise.race([search(), sleep(25000)]);
    await waitFor(() => lastV || out.querySelector('.list .item,.msg.err'), 8000);
    if (!lastV) {   // varios resultados: abre el que tiene el mismo nombre
      const el = [...out.querySelectorAll('.list .item')].find(e => normName(e.querySelector('div')?.textContent) === normName(i.name));
      if (!el) return false;
      el.click(); await waitFor(() => lastV, 20000);
    }
    // si se abrió otra versión (otra rareza o edición), busca la tuya entre las versiones
    if (lastV && !same(lastV, i) && current?.items?.length > 1) {
      // espera a que se carguen los datos de las demás versiones (hasta entonces solo se conoce su id)
      await waitFor(() => !current || current.items.every(x => !x?.id || (current.label(x) || {}).t !== x.id), 15000);
      if (!current) return false;
      const score = x => { const l = current.label(x) || {}; return [...String(l.t || '').split(' · '), l.r].filter(Boolean).filter(p => (i.label || '').includes(p)).length; };
      const order = current.items.map((x, k) => [k, score(x)]).filter(a => a[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
      for (const [k] of order) { if (same(lastV, i)) break; current.index = k; lastV = null; await Promise.race([drawCurrent(), sleep(20000)]); }
    }
    return same(lastV, i);   // solo si es exactamente tu carta se guarda su precio (lo hace la ficha)
  }
  (async () => {
    if (!await waitFor(() => window.cuentaAPI?.ready, 25000)) return post({ t: 'done', n: 0, ch: 0 });
    const list = cuentaAPI.list().filter(i => (i.qty > 0 || i.fav) && i.name && !i.sealed)
      .sort((a, b) => (a.updated?.toMillis?.() || 0) - (b.updated?.toMillis?.() || 0)).slice(0, 60);
    post({ t: 'prog', k: 0, n: list.length });
    let ch = 0, k = 0;
    for (const i of list) {
      try { if (await one(i) && Number(lastV.value) && Number(lastV.value) !== i.value) ch++; } catch (e) { console.warn(e); }
      post({ t: 'prog', k: ++k, n: list.length });
      await sleep(600);
    }
    await sleep(2000);   // deja terminar de guardar en la cuenta
    post({ t: 'done', n: list.length, ch });
  })();
  return;
}

// ---------------------------------------------------------------- VENTANA PRINCIPAL: lanza la copia invisible
const KEY = 'pc_bg_day';
const pill = document.createElement('div'); pill.className = 'bgpill'; pill.hidden = true; pill.setAttribute('role', 'status');
document.body.appendChild(pill);
let fr = null, st = '', killT = 0;
const today = () => { try { return localStorage.getItem(KEY) === dayKey(); } catch (e) { return false; } };
function show(txt, p){ pill.hidden = false; pill.innerHTML = `<span>${esc(txt)}</span><i style="width:${Math.round((p || 0) * 100)}%"></i>`; }
function stop(){ if (fr) { fr.remove(); fr = null; } clearTimeout(killT); pill.classList.add('out'); setTimeout(() => { pill.hidden = true; pill.classList.remove('out'); }, 300); }
function start(force){
  if (fr) return window.pcToast?.('🔄', T('Ya se están actualizando los precios'));
  const api = window.cuentaAPI;
  if (!api?.user) { if (force) api?.login(T('Entra para guardar cartas en tu colección.')); return; }
  if (!force && today()) return;
  if (!api.list().some(i => i.qty > 0 || i.fav)) { if (force) window.pcToast?.('📚', T('Tu colección está vacía. Busca una carta y añádela.')); return; }
  try { localStorage.setItem(KEY, dayKey()); } catch (e) {}
  fr = document.createElement('iframe');
  fr.src = HERE + '?bg=1&t=' + Date.now();   // siempre la última versión de la app (sin caché)
  fr.className = 'bgframe'; fr.tabIndex = -1; fr.setAttribute('aria-hidden', 'true'); fr.title = 'bg';
  document.body.appendChild(fr);
  st = '…'; show('🔄 ' + T('Actualizando precios…'), 0);
  killT = setTimeout(stop, 12 * 60e3);
}
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data?.pcbg || !fr || e.source !== fr.contentWindow) return;
  const m = e.data;
  if (m.t === 'prog') { st = `${m.k}/${m.n}`; show(`🔄 ${T('Actualizando precios')} ${m.k}/${m.n}`, m.n ? m.k / m.n : 0); }
  if (m.t === 'done') {
    stop();
    if (m.n) window.pcToast?.('✅', T('Precios actualizados'), m.ch ? T('{0} de {1} cartas han cambiado de precio', m.ch, m.n) : T('{0} cartas revisadas, sin cambios', m.n), 5000);
    if (view === 'home') window.GX?.drawHome(); else if (view === 'me' && !current) showProfile();
  }
});
window.pcBg = { start, status: () => fr ? st : today() ? T('Hoy') + ' ✓' : '' };
// arranca sola una vez al día, unos segundos después de abrir la app con la sesión iniciada
addEventListener('pc:col', function once(){ removeEventListener('pc:col', once); setTimeout(() => { if (document.visibilityState === 'visible') start(false); }, 5000); });

// ---------------------------------------------------------------- DESLIZAR HACIA ABAJO PARA REFRESCAR
if ('ontouchstart' in window) {
  const ind = document.createElement('div'); ind.className = 'ptr'; ind.innerHTML = '<span>↻</span>'; document.body.appendChild(ind);
  let y0 = null, d = 0;
  const reset = () => { ind.classList.remove('show', 'ready'); ind.style.transform = ''; };
  addEventListener('touchstart', e => {
    y0 = scrollY <= 0 && e.touches.length === 1 && !e.target.closest('.sheet,.login,.scan,.tabscan,.rail,.top5,.pchart,.tiltw,input,select,textarea') ? e.touches[0].clientY : null; d = 0;
  }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    d = Math.min(Math.max(0, e.touches[0].clientY - y0) * .5, 90);
    if (!d || scrollY > 0) return reset();
    ind.classList.add('show'); ind.classList.toggle('ready', d >= 60);
    ind.style.transform = `translate(-50%, ${d}px) rotate(${d * 4}deg)`;
  }, { passive: true });
  addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null;
    if (d < 60) return reset();
    ind.classList.add('spin'); setTimeout(() => { ind.classList.remove('spin'); reset(); }, 900);
    if ($('refresh')) return $('refresh').click();                  // ficha de carta: precio de nuevo
    if (view === 'home') { start(true); return window.GX?.drawHome(); } // inicio: actualiza toda la colección
    if (typeof redraw === 'function') redraw();
  });
}
})();
</script>
