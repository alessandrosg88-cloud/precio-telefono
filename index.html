<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Versión de teléfono: usa los datos y traducciones de la web publicada -->
<base href="https://alessandrosg88-cloud.github.io/precio-cartas/">
<meta name="robots" content="noindex, nofollow">
<script src="acceso.js?v=3"></script>
<link rel="icon" href="logo.jpg">
<link rel="apple-touch-icon" href="logo.jpg">
<meta name="theme-color" content="#6a44f2">

// ?bg=1: copia invisible de la app que actualiza los precios de tus cartas en segundo plano
window.PC_BG = /[?&]bg=1\b/.test(location.search) && window.parent !== window;</script>
<link rel="manifest" href="/precio-telefono/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Precio Cartas">
<title>Precio Cartas – Colezzioni Saglimbeni Medina</title>
<style>
  /* Identidad Colezzioni: violeta coleccionista + oro. Tema: auto / claro / oscuro (html[data-theme]) */
  :root{
    --bg:#f5f3fb; --card:#ffffff; --text:#17142b; --muted:#6c6883; --line:#e6e2f1;
    --accent:#6a44f2; --accent-2:#a347e6; --accent-soft:#efeafe; --gold:#f2b01e; --gold-soft:#fff5d9;
    --good:#0e9f6e; --bad:#e5484d; --warn:#b7791f;
    --shadow:0 1px 2px rgba(23,20,43,.05),0 10px 28px -12px rgba(48,30,120,.18);
    --grad:linear-gradient(135deg,#6a44f2 0%,#a347e6 60%,#e2569b 100%);
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#0d0b16; --card:#17142a; --text:#efedf8; --muted:#a19cb8; --line:#2a2643;
    --accent:#8f72ff; --accent-2:#c27bff; --accent-soft:#251f45; --gold:#ffc94a; --gold-soft:#3a2f12;
    --good:#34d399; --bad:#ff7a7f; --warn:#fbbf24;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#0d0b16; --card:#17142a; --text:#efedf8; --muted:#a19cb8; --line:#2a2643;
      --accent:#8f72ff; --accent-2:#c27bff; --accent-soft:#251f45; --gold:#ffc94a; --gold-soft:#3a2f12;
      --good:#34d399; --bad:#ff7a7f; --warn:#fbbf24;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
  .wrap{max-width:900px;margin:0 auto;padding:28px 16px 60px}
  h1{font-size:30px;margin:0 0 4px;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 0 20px}
  .langbar{position:relative;display:flex;justify-content:flex-end;gap:8px;margin:-12px 0 6px}
  /* cuenta de usuario (cuenta.js) */
  .acct{position:relative}
  .acct .lsel{display:flex;align-items:center;gap:6px}
  .acct .lsel img{width:22px;height:22px;border-radius:50%}
  .acct .lmenu{min-width:220px}
  .acct .who{font-size:13px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis}
  .login{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
  .login[hidden]{display:none}
  .lbox{position:relative;background:var(--card);color:var(--text);border-radius:16px;padding:22px;width:min(380px,100%);display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
  .lbox h2{margin:0 0 4px;font-size:20px;text-align:center}
  .lbox input{font-size:16px;padding:11px 13px}
  .lbox .gbtn{margin:0;width:100%}
  .lbox .google{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
  .lrow{display:flex;gap:8px}
  .lor{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 0}
  .lclose{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
  .link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px;text-align:left}
  .lmsg{margin:0;font-size:14px;min-height:1em}
  .lmsg.err{color:var(--bad)} .lmsg.ok{color:var(--good)}
  .gbtn.soft{background:var(--accent-soft);color:var(--accent)}
  .gbtn.soft.on{background:#f59e0b;color:#fff}
  .mine{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
  .mine .gbtn{margin:0}
  .qty{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border-radius:10px;padding:5px 8px;font-weight:600}
  .qty button,.mq button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:16px}
  .mbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
  .mbar select{font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .mtabs{margin-bottom:6px}
  .mg{margin:18px 0 6px;font-size:18px} .mg small{color:var(--muted);font-weight:500;font-size:14px}
  .mset{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
  .mset summary{cursor:pointer;font-weight:600} .mset summary small{color:var(--muted);font-weight:500}
  .mrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
  .mrow:first-of-type{border-top:0}
  .mrow img,.mrow .noimg{width:48px;aspect-ratio:63/88;object-fit:cover;border-radius:4px;background:var(--line);flex:none;display:grid;place-items:center}
  .mrow .mi{flex:1;min-width:0}
  .mrow .mopen{font-weight:600;font-size:15px}
  .mq{display:flex;align-items:center;gap:6px;flex:none}
  .mq .mfav.on{color:#f59e0b}
  .lsel{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .lmenu{position:absolute;top:calc(100% + 4px);right:0;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px;display:none;min-width:180px}
  .lmenu.open{display:block}
  .lmenu button{display:flex;gap:8px;width:100%;border:0;background:none;color:var(--text);padding:8px 10px;border-radius:8px;font-size:15px;cursor:pointer;text-align:left}
  .lmenu button:hover{background:var(--accent-soft)}
  .lmenu button.on{background:var(--accent);color:#fff;font-weight:700}
  .picker-game{position:relative;display:flex;justify-content:center;margin-bottom:16px}
  .gsel{display:flex;align-items:center;gap:10px;border:2px solid var(--accent);background:var(--card);color:var(--text);padding:10px 18px;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;min-width:260px;justify-content:space-between}
  .gsel small{display:block;font-size:12px;color:var(--muted);font-weight:600;text-align:left}
  .gsel .ico{font-size:24px}
  .gsel .car{font-size:14px;color:var(--accent);transition:transform .15s}
  .gsel[aria-expanded="true"] .car{transform:rotate(180deg)}
  .gmenu{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);z-index:5;width:min(560px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:8px;display:none;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:4px}
  .gmenu.open{display:grid}
  .tab{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--text);padding:10px 12px;border-radius:10px;font-size:15px;cursor:pointer;text-align:left}
  .tab:hover{background:var(--accent-soft)}
  .tab.on{background:var(--accent);color:#fff;font-weight:700}
  .tab .ico{font-size:20px}
  form{display:flex;gap:8px}
  input{flex:1;min-width:0;font-size:18px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--text)}
  input:focus{outline:none;border-color:var(--accent)}
  button.go{font-size:18px;padding:0 22px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  .help{background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin:14px 0 22px;font-size:15px}
  .help b{font-family:ui-monospace,Menlo,monospace}
  .ex{display:inline-block;margin:4px 6px 0 0;padding:3px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);cursor:pointer;font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--text)}
  .msg{text-align:center;color:var(--muted);padding:24px}
  .msg.err{color:var(--bad)}
  .result{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;grid-template-columns:260px 1fr;gap:22px;touch-action:pan-y}
  .pic{position:relative}
  /* Overframe (Extended Art) */
  .ofribs{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
  .ofrib{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.02em;
    color:#1b1030;background:linear-gradient(90deg,#ffd76a,#ff9de2,#9ad8ff);box-shadow:0 2px 8px rgba(0,0,0,.35);pointer-events:none}
  .oft{position:absolute;top:4px;left:50%;transform:translateX(-50%);z-index:2;padding:1px 6px;border-radius:999px;font-size:9.5px;font-weight:800;
    text-transform:uppercase;letter-spacing:.03em;color:#1b1030;background:linear-gradient(90deg,#ffd76a,#ff9de2,#9ad8ff);white-space:nowrap;pointer-events:none}
  .tile.of{border-color:#e0a3ff}
  .ofb{display:inline-block;vertical-align:middle;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800;color:#1b1030;
    background:linear-gradient(90deg,#ffd76a,#ff9de2,#9ad8ff)}
  .rar.ofr{color:#1b1030;background:linear-gradient(90deg,#ffd76a,#ff9de2,#9ad8ff)}
  .chip.ofc{border-color:#e0a3ff}
  .ofrib.gmr,.oft.gmr,.gmrb,.rar.gmrr{color:#2a1a00;background:linear-gradient(90deg,#fff1a8,#f2b632,#c98a12)}
  .gmrb{display:inline-block;vertical-align:middle;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800}
  .tile.gmr,.chip.gmrc{border-color:#f2b632}
  .ofrib.str,.oft.str,.strb,.rar.strr{color:#fff;background:linear-gradient(90deg,#3b2a8f,#7a5cff,#40c4ff);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .strb{display:inline-block;vertical-align:middle;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800}
  .tile.str,.chip.strc{border-color:#7a5cff}
  .oft.t2{top:20px}
  /* etiquetas (Overframe, GMR, Starlight, sello) también en las miniaturas pequeñas de la colección y del mercado */
  .mthumb{position:relative;display:inline-block;flex:none;line-height:0}
  .mthumb .oft{top:auto;bottom:3px;left:50%;font-size:7.5px;padding:1px 4px;line-height:1.2;letter-spacing:0;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .mthumb .oft.t2{top:auto;bottom:15px}
  .ofrib.st,.oft.st,.stb,.rar.str2{color:#fff;background:linear-gradient(90deg,#b3121f,#e0462f,#f2b632);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .stb{display:inline-block;vertical-align:middle;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:800}
  .chip.stc{border-color:#e0462f}
  .gchips{margin:0 0 12px}
  .addall{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px}
  .mkinds{margin:0 0 12px}
  .vspec:empty{display:none} .vspec{margin:0 0 12px}
  .vspecs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .vs{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit}
  .vs b{font-size:13px} .vs span{font-size:11.5px;color:var(--muted)} .vs i{font-style:normal;font-weight:800;font-size:14px;color:var(--good)}
  .vs.st{border-color:#e0462f} .vs.of{border-color:#e0a3ff} .vs.gmr{border-color:#f2b632} .vs.str{border-color:#7a5cff}
  .vs.on{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
  .mkinds .k-st{border-color:#e0462f} .mkinds .k-of{border-color:#e0a3ff} .mkinds .k-gmr{border-color:#f2b632} .mkinds .k-str{border-color:#7a5cff}
  .top5 .oft.t2{top:40px}
  .top5 .oft{top:24px}
  .ofnote{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
  .pic img{width:100%;border-radius:10px;display:block;min-height:120px;background:var(--line)}
  .pic.loading img{opacity:.35}
  .altrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
  .alt{flex:1 1 0;min-width:70px;max-width:110px;padding:4px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:11px;line-height:1.2}
  .alt.on{border-color:var(--accent)}
  .alt img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:4px;display:block;margin-bottom:3px;background:var(--line)}
  .replica{font-size:12px;color:var(--muted,#888);margin:6px 2px 0;line-height:1.35}
  .tile.rep img,.item.rep img{opacity:.55}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .arrow{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:22px;cursor:pointer;flex:none}
  .arrow:hover{border-color:var(--accent);color:var(--accent)}
  .vlabel{text-align:center;font-size:13px;color:var(--muted);line-height:1.3}
  .vlabel b{display:block;color:var(--text);font-size:14px}
  .picker{margin:0 0 14px}
  .result > *{min-width:0}
  .rail{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 0 10px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;overscroll-behavior-x:contain}
  .tile{flex:none;width:88px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;border:2px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:5px;cursor:pointer;font:inherit}
  .tile img{width:100%;aspect-ratio:63/88;object-fit:cover;border-radius:6px;background:var(--line)}
  .tile .noimg{width:100%;aspect-ratio:63/88;display:grid;place-items:center;border-radius:6px;background:var(--line);font-size:24px}
  .tile .tr{font-size:11px;line-height:1.2;color:var(--muted);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .tp{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile:hover{border-color:var(--accent)}
  .tile.on{border-color:var(--accent);background:var(--accent-soft)}
  .tile.on .tr{color:var(--accent);font-weight:700}
  .pic img.slideR{animation:slideR .22s ease-out}
  .pic img.slideL{animation:slideL .22s ease-out}
  @keyframes slideR{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
  @keyframes slideL{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){.pic img.slideR,.pic img.slideL{animation:none}.rail{scroll-behavior:auto}}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .chip small{opacity:.7;margin-left:3px}
  .picker select{width:100%;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .picker .lbl2{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .dots{display:flex;gap:5px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .name{font-size:24px;font-weight:700;margin:0}
  .meta{color:var(--muted);margin:4px 0 10px}
  .rar{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;margin:0 0 12px}
  .big{background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin-bottom:14px}
  .big .lbl{font-size:14px;color:var(--muted)}
  .big .val{font-size:40px;font-weight:800;color:var(--good)}
  .approx{color:var(--warn);font-size:13px}
  .upd{font-size:13px;color:var(--muted);margin-top:4px}
  .refresh{margin-left:6px;border:1px solid var(--line);background:var(--card);color:var(--accent);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:15px}
  td{padding:8px 4px;border-bottom:1px solid var(--line)}
  td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .sec{font-weight:700;padding-top:14px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .links a,.links button{padding:8px 14px;border-radius:10px;border:1px solid var(--line);color:var(--accent);background:var(--card);text-decoration:none;font-weight:600;font-size:15px;cursor:pointer}
  .links .main{background:var(--accent);color:#fff;border-color:var(--accent)}
  details.grade{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  details.grade summary{cursor:pointer;font-weight:700}
  .gtable td:first-child a{color:var(--accent);font-weight:700;text-decoration:none}
  .gtable td{font-size:14px}
  .gtable td:last-child{font-weight:400;text-align:right;color:var(--muted)}
  .note{font-size:13px;color:var(--muted);margin:8px 0 0}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:center;font-size:13px;color:var(--text)}
  .item img{width:100%;border-radius:6px;aspect-ratio:5/7;object-fit:cover;background:var(--line)}
  .item .p{font-weight:700;color:var(--good);font-size:14px}
  .item:hover{border-color:var(--accent)}
  .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .bar h2{font-size:20px;margin:0}
  .bar select{font-size:15px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .back{background:none;border:0;color:var(--accent);cursor:pointer;font-size:15px;margin-bottom:10px;padding:0}
  .gbtn{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  details.howto{margin:16px 0 0;border:2px solid var(--accent-soft);border-radius:12px;padding:10px 14px}
  details.howto summary{cursor:pointer;font-weight:700;font-size:16px}
  .howto p{margin:10px 0;font-size:15px}
  .howto ul{margin:6px 0;padding-left:20px;font-size:15px}
  .ctext{background:var(--bg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.5}
  .ctext .lbl2,.howto .lbl2{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  table.stats td{font-size:14px;padding:5px 4px}
  .gpage{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
  .gpage h2{margin:0 0 14px}
  .gstep{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
  .gico{font-size:30px;line-height:1}
  .gstep h3{margin:0 0 4px;font-size:17px}
  .gstep p{margin:0;font-size:16px;line-height:1.55}
  .sfilters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .sfind{width:100%;font-size:16px;padding:10px 12px;margin:0 0 10px}
  .more{display:block;margin:14px auto;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:700;cursor:pointer}
  /* ---- Centrado PSA (centrado.js) ---- */
  .cintro{margin:0 0 12px;font-size:15px}
  .cpick,.ctools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 10px}
  .cpick .gbtn,.ctools .gbtn{margin:0}
  .cpick .gbtn{font-size:17px;padding:12px 18px}
  .ctips{font-size:14px;color:var(--muted);margin:12px 0}
  .crot{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
  .crot input{width:130px}
  .cwrap{width:100%;display:flex;justify-content:center;margin:8px 0}
  .cwrap canvas{touch-action:none;border-radius:8px;background:#000;cursor:crosshair;outline:none;max-width:100%}
  .cfine{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:600}
  .cbtns{display:flex;gap:6px}
  .cbtns button{width:44px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:16px;cursor:pointer}
  .clegend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin:6px 0 12px}
  .clegend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
  .cside.done:not(.on)::after{content:' ✓';color:var(--good)}
  .cbar{margin:10px 0}
  .cbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
  .cbl b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
  .cbt{position:relative;height:10px;border-radius:5px;background:var(--line);margin:4px 0}
  .cbt em{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--muted)}
  .cbt i{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--accent);border:2px solid var(--card)}
  .cbar small{color:var(--muted)}
  .cgrades{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
  .cgrade{flex:1;min-width:200px;background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column}
  .cgrade span{font-size:13px;color:var(--muted);font-weight:600}
  .cgrade b{font-size:32px;color:var(--accent);line-height:1.15}
  .cgrade.small b{font-size:24px}
  .cgrade small{color:var(--muted)}
  footer{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
  /* ---- Escáner ---- */
  button.cam{font-size:22px;padding:0 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
  .scan{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:10;color:#fff}
  .scan.open{display:flex}
  .scan p{margin:0 0 12px;text-align:center;font-size:16px}
  .view{position:relative;width:100%;max-width:520px;border-radius:14px;overflow:hidden;background:#000}
  .view video{display:block;width:100%;height:auto}
  .guide{position:absolute;left:8%;width:84%;top:38%;height:24%;border:3px solid #4ade80;border-radius:10px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
  .scanbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
  .scanbtns button,.scanbtns label{font-size:17px;padding:12px 20px;border-radius:12px;border:0;cursor:pointer;font-weight:600}
  .shoot{background:#4ade80;color:#06281a}
  .sec2{background:#2a2f3a;color:#fff}
  #scanStatus{min-height:24px;margin-top:12px;text-align:center;font-size:15px;color:#d1d5db}
  @media (max-width:640px){ .result{grid-template-columns:1fr} .pic{max-width:280px;margin:0 auto;width:100%} .big .val{font-size:34px} }

  /* ================= VERSIÓN TELÉFONO ================= */
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
  .wrap{padding:0 14px 24px}
  .langbar{display:none}
  .appbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;margin:0 -14px 10px;padding-left:14px;padding-right:14px;border-bottom:1px solid var(--line)}
  .appbar h1{font-size:21px;margin:0;flex:1;text-align:left;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .appbar h1 .logo{width:38px;height:38px;border-radius:50%;flex:none}
  .appbar .gchip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;cursor:pointer}
  .wrap > h1,.wrap > .sub{display:none}
  .picker-game{margin:0;position:static}
  .picker-game .gsel{display:none}
  .gmenu{top:calc(58px + env(safe-area-inset-top));position:fixed;left:50%;width:calc(100% - 24px)}
  form{position:relative}
  input{font-size:16px;padding:12px 14px}
  button.go{font-size:16px;padding:0 16px}
  .help{font-size:14px;margin:10px 0 14px}
  footer{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
  body:not(.v-search) #form, body:not(.v-search) #help{display:none}
  /* barra de abajo, estilo Instagram */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 0;cursor:pointer}
  .tabbar button .i{font-size:23px;line-height:1;filter:grayscale(1);opacity:.75;transition:transform .12s}
  .tabbar button.on{color:var(--text)}
  .tabbar button.on .i{filter:none;opacity:1;transform:scale(1.12)}
  .tabbar button.tabscan .i{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#f58529,#dd2a7b 50%,#515bd4);color:#fff;filter:none;opacity:1;font-size:24px;box-shadow:0 4px 14px rgba(221,42,123,.35);margin-top:-18px}
  .tabbar .badge{position:absolute;margin:-2px 0 0 22px;background:#ef4444;color:#fff;border-radius:999px;font-size:10px;padding:0 5px;min-width:16px;line-height:16px}
  .tabbar button{position:relative}
  /* 7 columnas iguales: el botón de Centrado PSA (4º) queda siempre en el centro */
  .tabbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:stretch}
  .tabbar button{min-width:0;width:100%}
  .tabbar button > span:not(.i):not(.badge){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabbar button.tabscan{justify-content:center}
  /* perfil */
  .prof{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:4px 0 14px}
  .prof .av{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,#f58529,#dd2a7b,#515bd4);display:grid;place-items:center;font-size:28px;color:#fff;flex:none;overflow:hidden}
  .prof .av img{width:100%;height:100%;object-fit:cover}
  .prof .nm{font-weight:700;font-size:17px} .prof .em{color:var(--muted);font-size:13px;word-break:break-all}
  .stats{display:flex;gap:18px;margin-top:6px;font-size:13px;color:var(--muted)} .stats b{color:var(--text);font-size:16px;display:block}
  .menu-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
  .menu-list button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--text);padding:14px 16px;font-size:16px;cursor:pointer;text-align:left}
  .menu-list button:first-child{border-top:0}
  .menu-list button .r{margin-left:auto;color:var(--muted);font-size:14px}
  .menu-list button.on{color:var(--accent);font-weight:700}
  .ptitle{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 4px 6px}
  .result{gap:14px}
  #help #sbtn,#help #gbtn{display:none}   /* ya están en la barra de abajo y en Perfil */
  body.has-out #help{display:none}        /* con resultados, solo el buscador (como una app) */

  /* ================= REDISEÑO 2026: identidad propia ================= */
  body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em;transition:background-color .25s,color .25s}
  ::selection{background:var(--accent);color:#fff}
  .appbar{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
  .appbar h1 .logo{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
  .appbar .brand{display:flex;flex-direction:column;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  .appbar .brand small{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-top:2px}
  .tbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:transform .2s}
  .tbtn:active{transform:rotate(-25deg) scale(.9)}
  button,.ex,.chip,.tile,.item,.links a{transition:transform .12s ease,box-shadow .2s,background-color .2s,border-color .2s,color .2s}
  button:active,.ex:active,.chip:active,.item:active,.links a:active{transform:scale(.96)}
  .gbtn,button.go,.links .main{background:var(--grad);box-shadow:0 6px 16px -8px var(--accent)}
  .gbtn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
  .gbtn.soft.on{background:linear-gradient(135deg,#f2b01e,#f07b1e);color:#fff}
  input{border-width:1.5px;border-radius:14px;transition:border-color .2s,box-shadow .2s}
  input:focus{box-shadow:0 0 0 4px var(--accent-soft)}
  button.cam{border-width:1.5px;border-radius:14px}
  .help{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}
  .result,.item,.prof,.menu-list,.gpage,.mset,.lbox{border-radius:20px;box-shadow:var(--shadow)}
  .item{border-radius:16px}
  .item:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(80,50,180,.35)}
  .big{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--gold-soft) 55%,var(--accent-soft)));border-radius:16px}
  .rar{background:var(--gold-soft);color:var(--warn)}
  .tabbar{background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px)}
  .tabbar button.tabscan .i{background:var(--grad);box-shadow:0 6px 18px -4px rgba(106,68,242,.55)}
  .tabbar button.on .i{animation:pop .35s ease}
  .prof .av{background:var(--grad)}
  #out > *{animation:fadeUp .28s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.25)}100%{transform:scale(1.12)}}
  @media (prefers-reduced-motion: reduce){ #out > *,.tabbar button.on .i{animation:none} }

  /* ---- Panel de progreso (gamificación) ---- */
  body:not(.v-home) #gx{display:none} body.v-home #out{display:none}
  .gxh{display:flex;align-items:center;gap:14px;background:var(--grad);color:#fff;border-radius:22px;padding:14px 16px;margin:4px 0 12px;cursor:pointer;box-shadow:0 14px 30px -14px rgba(106,68,242,.7);position:relative;overflow:hidden;border:0;width:100%;text-align:left;font:inherit}
  .gxh::after{content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.09)}
  .ring{--p:0;width:58px;height:58px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
  .ring b{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(20,10,60,.55);font-size:19px;font-weight:800;color:#fff}
  .ring.lg{width:96px;height:96px} .ring.lg b{width:78px;height:78px;font-size:30px}
  .gxh .t{flex:1;min-width:0}
  .gxh .t b{display:block;font-size:16px} .gxh .t small{opacity:.88;font-size:12.5px}
  .xpbar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin:6px 0 4px}
  .xpbar i{display:block;height:100%;border-radius:99px;background:var(--gold);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .streak{flex:none;text-align:center;font-weight:800;font-size:20px;line-height:1;z-index:1}
  .streak small{display:block;font-size:10.5px;font-weight:600;opacity:.85;margin-top:3px}
  .streak.off{filter:grayscale(1);opacity:.6}
  .gxsec{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px;margin:0 0 12px}
  .gxsec h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .gxsec h3 small{color:var(--muted);font-weight:600;font-size:12px}
  .mis{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .mis:first-of-type{border-top:0}
  .mis .mi-ico{width:38px;height:38px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:19px;flex:none}
  .mis.done .mi-ico{background:var(--good);color:#fff}
  .mis .mi-b{flex:1;min-width:0;font-size:14.5px;font-weight:600}
  .mis .pbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
  .mis .pbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
  .mis.done .pbar i{background:var(--good)}
  .mis .mi-x{font-size:12px;font-weight:800;color:var(--warn);background:var(--gold-soft);padding:3px 8px;border-radius:99px;flex:none}
  .medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
  .medal{text-align:center;padding:10px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.25}
  .medal .mi{width:50px;height:50px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--line);filter:grayscale(1);opacity:.55}
  .medal b{display:block;color:var(--text);font-size:12px;margin-bottom:2px}
  .medal.on .mi{filter:none;opacity:1;background:radial-gradient(circle at 30% 30%,#fff6d6,var(--gold));box-shadow:0 6px 16px -6px var(--gold)}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
  @media (min-width:640px){ .kpis{grid-template-columns:repeat(4,1fr)} }
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
  .kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}
  .kpi b{display:block;font-size:20px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .kpi small{color:var(--muted);font-size:11.5px}
  .up{color:var(--good)} .down{color:var(--bad)}
  .goal-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .goal-form input,.goal-form select{font-size:14px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--text);flex:1;min-width:120px}
  .gx-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .sw.on{background:var(--good)} .sw.on::after{transform:translateX(18px)}
  .seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;border:0;background:none;color:var(--text);padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer}
  .seg button.on{background:var(--card);box-shadow:var(--shadow);color:var(--accent)}

  /* ---- Toasts, +XP y confeti ---- */
  .toasts{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(420px,calc(100% - 24px));pointer-events:none}
  .toast{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:18px;padding:11px 14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);animation:tin .45s cubic-bezier(.2,1.4,.4,1) both;pointer-events:auto}
  .toast.out{animation:tout .3s ease forwards}
  .toast .ti{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle at 30% 30%,#fff6d6,var(--gold))}
  .toast b{display:block;font-size:14.5px} .toast small{color:var(--muted);font-size:12.5px}
  @keyframes tin{from{opacity:0;transform:translateY(-20px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateY(-14px) scale(.95)}}
  .xpf{position:fixed;z-index:95;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);font-weight:900;font-size:20px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none;animation:xpf 1.1s ease-out forwards}
  @keyframes xpf{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px) scale(1)}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:89}

  /* ---- Ficha: evolución y comparador ---- */
  .fx{margin:0 0 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
  .fx > summary{cursor:pointer;font-weight:700;padding:12px 14px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  .fx > summary::-webkit-details-marker{display:none}
  .fx > summary::after{content:"▾";color:var(--muted);transition:transform .2s}
  .fx[open] > summary::after{transform:rotate(180deg)}
  .fx .fxb{padding:0 14px 14px}
  .pchart{position:relative;touch-action:pan-y;user-select:none;margin:6px 0 2px}
  .pchart svg{display:block;width:100%;height:130px;color:var(--accent);overflow:visible}
  .pchart .ln{fill:none;stroke:currentColor;stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
  .pchart .gl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke;stroke-dasharray:3 4}
  .pchart .pm{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--card);border:3px solid var(--accent);display:none;pointer-events:none}
  .pchart .ptip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--text);color:var(--bg);font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap;display:none;pointer-events:none}
  .pchart .paxis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
  .pchart .pyr{position:absolute;right:0;font-size:10.5px;color:var(--muted);background:var(--card);padding:0 3px;border-radius:4px}
  .cmp{width:100%;border-collapse:collapse;font-size:14px}
  .cmp td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top}
  .cmp td:last-child{text-align:right}
  .cmp .src{font-weight:700} .cmp .src small,.cmp td small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
  .cmp .pv{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
  .cmp a{color:var(--accent);font-weight:700;text-decoration:none;font-size:13px}
  .fchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
  .fchip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .gfilter{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
  .gfilter input{font-size:14px;padding:9px 12px;flex:1;min-width:150px}
  .gfilter .chip{white-space:nowrap}

  /* ---- Mi colección 2.0 ---- */
  .mtools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}

<script>
// =====================================================================
//  JUEGOS
//  type 'api'   -> se consulta en directo (Pokémon, Yu-Gi-Oh!, Magic)
//  type 'local' -> datos de /data/<juego>.json, se actualizan solos cada día (GitHub Action)
//  type 'links' -> no hay base de datos de precios pública: enlaces de búsqueda
// =====================================================================
const GAMES = {
  pokemon:   { label: 'Pokémon', type: 'api', cm: 'Pokemon',
    help: 'Usa el <b>código del set + número</b> de abajo de la carta (ej. <b>OBF 125</b>), solo el número (<b>125/197</b>) o el nombre en inglés.',
    ex: ['OBF 125', '125/197', 'base1-4', 'Pikachu'] },
  yugioh:    { label: 'Yu-Gi-Oh!', type: 'api', cm: 'YuGiOh',
    help: 'Usa el <b>código impreso</b> debajo de la imagen (ej. <b>LOB-EN001</b>), también en alemán, francés, italiano, portugués o español (<b>LOB-DE001</b>, <b>LOB-SP001</b>…), o el nombre de la carta en cualquiera de esos idiomas o en inglés.',
    ex: ['LOB-EN001', 'LOB-DE001', 'Dark Magician', 'Dragón Blanco de Ojos Azules'] },
  magic:     { label: 'Magic', type: 'api', cm: 'Magic',
    help: 'Usa el <b>código del set + número</b> de abajo a la izquierda (ej. <b>MH3 123</b>) o el nombre en inglés.',
    ex: ['MH3 123', 'LEA 232', 'Lightning Bolt'] },
  onepiece:  { label: 'One Piece', type: 'local', cm: 'OnePiece',
    help: 'Usa el <b>código</b> de abajo a la derecha (ej. <b>OP01-120</b>) o el nombre en inglés.',
    ex: ['OP01-120', 'OP05-119', 'Nami'] },
  dragonball:{ label: 'Dragon Ball', type: 'local', cm: 'DragonBallSuper',
    help: 'Fusion World, Masters y Dragon Ball Z (Panini). Usa el <b>código</b> (ej. <b>FB01-001</b>, <b>BT1-031</b>) o el nombre en inglés.',
    ex: ['FB01-139', 'BT1-031', 'Son Goku'] },
  digimon:   { label: 'Digimon', type: 'local', cm: 'Digimon',
    help: 'Usa el <b>código</b> de abajo a la derecha (ej. <b>BT1-084</b>) o el nombre en inglés.',
    ex: ['BT1-084', 'EX1-073', 'Omnimon'] },
  lorcana:   { label: 'Lorcana', type: 'local', cm: 'Lorcana',
    help: 'Usa el <b>número / total</b> de abajo (ej. <b>207/204</b>) o el nombre en inglés.',
    ex: ['207/204', 'Elsa', 'Stitch'] },
  gundam:    { label: 'Gundam', type: 'local', cm: 'Gundam',
    help: 'Usa el <b>código</b> (ej. <b>GD01-001</b>) o el nombre en inglés.',
    ex: ['GD01-001', 'ST01-001', 'Zaku'] },
  riftbound: { label: 'League of Legends', type: 'local', cm: 'Riftbound',
    help: 'Riftbound (el TCG de LoL). Usa el <b>número / total</b> (ej. <b>150/167</b>) o el nombre en inglés.',
    ex: ['150/167', 'Jinx', 'Ahri'] },
  weiss:     { label: 'Weiß Schwarz', type: 'local', cm: 'WeissSchwarz',
    help: 'Usa el <b>código</b> de la carta (ej. <b>KGL/S79-001</b>) o el nombre en inglés.',
    ex: ['Hatsune Miku', 'Rem', 'Asuna'] },
  wow:       { label: 'World of Warcraft', type: 'local', cm: 'WoW',
    help: 'Busca por <b>nombre</b> de la carta (en inglés) o por número.',
    ex: ['Spectral Tiger', 'Thrall', 'Illidan'] },
  duelmasters:{ label: 'Duel Masters', type: 'local', yen: true, noSealed: true,
    help: 'Precios de <b>Japón en yenes (¥)</b>, de Torekakaku. Busca por el <b>nombre en japonés</b> o por el <b>código</b> de abajo de la carta (ej. <b>DM26RP1</b>).',
    ex: ['ボルメテウス', 'ドギラゴン', 'DM26RP1'] },
};

let game = 'pokemon';
const $ = id => document.getElementById(id);
const out = $('out');
let backStack = []; // pantallas anteriores para el botón "Volver"

// ---- Selector de juego: un solo botón que abre la lista ----
const ICONS = { pokemon:'⚡', yugioh:'👁️', magic:'🔮', onepiece:'🏴‍☠️', dragonball:'🐉', digimon:'🦖', lorcana:'✨',
  gundam:'🤖', riftbound:'⚔️', weiss:'🌸', wow:'🛡️', duelmasters:'🔥' };
try { const saved = localStorage.getItem('juego'); if (saved && GAMES[saved]) game = saved; } catch (e) {}
$('tabs').innerHTML = Object.entries(GAMES).map(([k, g]) =>
  `<button class="tab" role="option" data-game="${k}"><span class="ico">${ICONS[k]}</span>${g.label}</button>`).join('');
function showGame(){
  $('gselIco').textContent = ICONS[game];
  $('gselName').textContent = GAMES[game].label;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.dataset.game === game));
}
function toggleMenu(open){
  $('tabs').classList.toggle('open', open);
  $('gsel').setAttribute('aria-expanded', open);
}
$('gsel').onclick = e => { e.stopPropagation(); toggleMenu(!$('tabs').classList.contains('open')); };
document.addEventListener('click', e => { if (!e.target.closest('.picker-game')) toggleMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  toggleMenu(false);
  if (game === t.dataset.game) return;
  game = t.dataset.game;
  try { localStorage.setItem('juego', game); } catch (e) {}
  showGame(); out.innerHTML = ''; backStack = []; $('q').value = ''; showHelp(); $('q').focus();
  if (GAMES[game].type === 'local') loadLocal(game).catch(() => {}); // precarga
});
showGame();

function showHelp(){
  const g = GAMES[game];
  $('help').innerHTML = T(g.help) + '<br>' + T('Ejemplos:') + ' ' + g.ex.map(e => `<span class="ex">${e}</span>`).join('') +
    `<br><button class="gbtn" id="gbtn">${T('📖 Cómo se juega a {0}', g.label)}</button>` +
    (g.type !== 'links' && !g.noSealed ? ` <button class="gbtn" id="sbtn">${T('📦 Cajas selladas')}</button>` : '');
  $('gbtn').onclick = () => { backStack = []; current = null; showGuide(game); };
  if ($('sbtn')) $('sbtn').onclick = () => { backStack = []; current = null; showSealed(game); };
  $('help').querySelectorAll('.ex').forEach(el => el.onclick = () => { $('q').value = el.textContent; search(); });
}
$('form').onsubmit = e => { e.preventDefault(); search(); };

// ===================== UTILIDADES =====================
const usd = v => money(v, 'USD');
const money = (v, cur, d = 2) => (v == null || v === '' || Number(v) === 0) ? null : new Intl.NumberFormat(LOCALE(), { style: 'currency', currency: cur, minimumFractionDigits: d, maximumFractionDigits: d }).format(Number(v));
const eur = v => money(v, 'EUR');
const fecha = d => d ? new Date(d).toLocaleDateString(LOCALE()) : '';
// reverso de carta para cuando no hay ninguna foto
const NOIMG = 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a44f2"/><stop offset=".6" stop-color="#a347e6"/><stop offset="1" stop-color="#e2569b"/></linearGradient></defs><rect width="63" height="88" rx="4" fill="url(#g)"/><rect x="4" y="4" width="55" height="80" rx="3" fill="none" stroke="#fff" stroke-opacity=".45"/><text x="31.5" y="44" font-size="18" text-anchor="middle">🃏</text><text x="31.5" y="60" font-size="6.5" font-family="system-ui,sans-serif" font-weight="700" fill="#fff" text-anchor="middle">Sin foto</text></svg>`);
// si una foto falla: prueba la siguiente dirección posible y, al final, pone el reverso
// foto con direcciones de reserva: url#pcalt=otra1|otra2… (el navegador ignora lo que va detrás de #)
const withAlts = urls => { urls = [...new Set(urls.filter(Boolean))]; return urls.length > 1 ? urls[0] + '#pcalt=' + encodeURIComponent(urls.slice(1).join('|')) : urls[0] || NOIMG; };
// si la foto que se encontró es de otro idioma, lo dice encima de la imagen
const LANG_PHOTO = { fr: ['🇫🇷', 'francés'], de: ['🇩🇪', 'alemán'], it: ['🇮🇹', 'italiano'], es: ['🇪🇸', 'español'], pt: ['🇵🇹', 'portugués'], ja: ['🇯🇵', 'japonés'] };
function langBadge(img){
  const m = img.src.startsWith('https://ws-tcg.com/') ? [0, 'ja'] : img.src.match(/^https:\/\/assets\.tcgdex\.net\/([a-z-]+)\//);
  const l = img.src.includes('#pcother') ? ['🔁', 'otra edición', 1] : img.src.includes('#pcsample') ? ['🔖', 'muestra', 2] : m && LANG_PHOTO[m[1]];
  const old = img.parentElement?.querySelector(':scope > .lbadge');
  if (!l) return old?.remove();
  if (old) return;
  const big = img.closest('.tiltw,.result');
  const full = l[2] === 2 ? T('Imagen de muestra (con sello SAMPLE)') : l[2] ? T('Foto de otra edición de esta carta') : T('Foto en {0}', T(l[1]));
  img.insertAdjacentHTML('afterend', `<span class="lbadge${big ? ' big' : ''}" title="${esc(full)}">${l[0]} ${big ? esc(full) : esc(T(l[1]))}</span>`);
}
const otherCache = {};
function otherPrint(name, q){
  // el mismo nombre escrito de otras formas: ’ / ', «-EX» / « EX»
  const names = [...new Set([name, name.replace(/[’‘]/g, "'"), name.replace(/-(EX|GX)\b/g, ' $1'), name.replace(/ (EX|GX)\b/g, '-$1')])];
  return (otherCache[name + '|' + q] ||= (async () => {
    for (const n of names) {
      const l = await getJSON(`https://api.tcgdex.net/v2/en/cards?name=eq:${encodeURIComponent(n)}`, 2).catch(() => null);
      const w = (l || []).filter(x => x.image);
      if (w.length) return `${w.at(-1).image}/${q}.webp`;
    }
    return null;
  })());
}
function imgMiss(e){
  const img = e.target; if (img.tagName !== 'IMG' || img.src.startsWith('data:') || img.getAttribute('referrerpolicy')) return;
  // pokemontcg.io no da error si no tiene la carta: devuelve un reverso de 640×892
  if (e.type === 'load' && !(img.src.startsWith(PTCG) && img.naturalWidth === 640 && img.naturalHeight === 892)) return langBadge(img);
  const h = img.src.indexOf('#pcalt=');
  if (h > 0) {
    const rest = decodeURIComponent(img.src.slice(h + 7)).split('|').filter(Boolean);
    if (rest[0]?.startsWith('pcname:')) {   // foto de otra edición de la misma carta (se busca por nombre)
      const [, q, ...nm] = rest[0].split(':'), name = nm.join(':'), after = rest.slice(1);
      img.src = NOIMG.replace('Sin%20foto', '%E2%80%A6');
      otherPrint(name, q).then(u => { if (img.isConnected) img.src = u ? u + '#pcother' + (after.length ? '&pcalt=' + encodeURIComponent(after.join('|')) : '') : NOIMG; });
      return;
    }
    if (rest.length) { img.src = withAlts(rest); return; }
  }
  // un fallo suelto (red lenta, demasiadas fotos a la vez): se reintenta una vez
  if (e.type === 'error' && !img.dataset.pcr) { img.dataset.pcr = 1; const u = img.src; setTimeout(() => { if (img.src === u) { img.removeAttribute('src'); img.src = u; } }, 1500); return; }
  if (img.closest('#out,#gx,.sheet,.result') || img.src.startsWith(PTCG)) img.src = NOIMG;
}
document.addEventListener('error', imgMiss, true);
document.addEventListener('load', imgMiss, true);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const normName = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

// Pide datos a una API; si falla, reintenta
async function getJSON(url, tries = 4){
  for (let i = 1; ; i++) {
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (r.status === 404 || r.status === 400) return null;
      if (!r.ok) throw new Error('Error ' + r.status);
      return await r.json();
    } catch (e) {
      if (i >= tries) throw e;
      await new Promise(ok => setTimeout(ok, 800 * i));
    }
  }
}

function error(t){ out.innerHTML = `<div class="msg err">${t}</div>`; }
function toTop(){ if (out.getBoundingClientRect().top < 0) out.scrollIntoView({ block: 'start' }); }
function remember(fn){ backStack.push(fn); }
function backBtn(){ return backStack.length ? `<button class="back" id="back">${T('← Volver')}</button>` : ''; }
function wireBack(){ const b = $('back'); if (b) b.onclick = () => { const fn = backStack.pop(); fn && fn(); }; }

// =====================================================================
//  VISOR DE CARTA CON VERSIONES
//  versions = { items: [...], index, build: async item => vista }
//  Se cambia de versión con las flechas, deslizando el dedo o con ← → del teclado.
// =====================================================================
let current = null;
let redraw = null; // vuelve a dibujar la pantalla actual al cambiar de idioma

async function showVersions(items, index, build, label){
  current = { items, index: Math.max(0, index), build, label: label || (() => ({ r: '', t: '' })) };
  await drawCurrent();
  toTop();
}

let slideDir = 0; // -1 izquierda, 1 derecha: para la animación de la imagen
function jump(i){
  if (!current || i === current.index) return;
  slideDir = i > current.index ? 1 : -1;
  current.index = i;
  const pic = out.querySelector('.pic'); if (pic) pic.classList.add('loading');
  drawCurrent();
}

// Selector de rareza / versión: botones con cada rareza + desplegable con todas las versiones
// Botones grandes con las versiones del mismo código cuando alguna es especial
// (con sello, Overframe, GMR, Starlight): así se ve de un vistazo y se cambia con un toque.
function drawSpecial(){
  const box = $('vspec'); if (!box) return;
  if (!current || current.items.length < 2) { box.innerHTML = ''; return; }
  const labels = current.items.map(current.label), i = current.index;
  const code = String(labels[i]?.t || '').split(' · ')[0];
  const ks = labels.map((l, k) => k).filter(k => String(labels[k]?.t || '').split(' · ')[0] === code);
  if (ks.length < 2 || !ks.some(k => labels[k].st || labels[k].of || labels[k].gmr || labels[k].str)) { box.innerHTML = ''; return; }
  const name = l => [l.st && '🏅 ' + T('Con sello'), l.of && '🖼️ Overframe', l.gmr && '🏆 GMR', l.str && '✨ Starlight'].filter(Boolean).join(' · ') || T('Normal');
  const alt = l => /alternate art/i.test(l.t) ? ' · ' + T('ilustración alternativa') : '';
  box.innerHTML = `<p class="lbl2">${T('Versiones de {0}', esc(code))}</p><div class="vspecs">${ks.map(k => { const l = labels[k];
    return `<button class="vs${k === i ? ' on' : ''}${l.st ? ' st' : l.of ? ' of' : l.gmr ? ' gmr' : l.str ? ' str' : ''}" data-k="${k}">
      <b>${name(l)}</b><span>${esc(l.r || '')}${alt(l)}</span><i>${l.p || '—'}</i></button>`; }).join('')}</div>`;
  box.querySelectorAll('.vs').forEach(b => b.onclick = () => jump(Number(b.dataset.k)));
}
function drawPicker(){
  drawSpecial();
  const box = $('vpick'); if (!box || !current) return;
  const n = current.items.length, i = current.index;
  if (n < 2) { box.innerHTML = ''; return; }
  const labels = current.items.map(current.label);
  const rars = [];
  labels.forEach((l, k) => { if (l.r && !rars.some(x => x.r === l.r)) rars.push({ r: l.r, k, count: 0 }); });
  labels.forEach(l => { const x = rars.find(x => x.r === l.r); if (x) x.count++; });
  const curR = labels[i].r;
  const nOF = labels.filter(l => l.of).length, nST = labels.filter(l => l.st).length;
  box.innerHTML = `
    <p class="lbl2">${T('Desliza para ver todas las versiones ({0})', n)}</p>
    <div class="rail" id="rail">${labels.map((l, k) =>
      `<button class="tile${k === i ? ' on' : ''}${l.rep ? ' rep' : ''}${l.of ? ' of' : ''}${l.gmr ? ' gmr' : ''}${l.str ? ' str' : ''}" data-k="${k}" title="${esc(ofText([l.t, l.r].filter(Boolean).join(' · ')))}">
        ${tileTags(l.of, l.gmr, l.str, l.st)}${l.i ? `<img src="${l.i}" alt="" loading="lazy">` : '<span class="noimg">🃏</span>'}
        <span class="tr">${esc(l.r || '—')}</span><span class="tp">${l.p || '·'}</span></button>`).join('')}</div>
    ${(rars.length > 1 && rars.length <= 20) || nOF || nST ? `<p class="lbl2">${T('Todas las rarezas de esta carta ({0})', rars.length)}</p><div class="chips">${nST ? `<button class="chip stc${labels[i].st ? ' on' : ''}" data-x="st">🏅 ${T('Con sello')}<small>×${nST}</small></button>` : ''}${nOF ? `<button class="chip ofc${labels[i].of ? ' on' : ''}" data-x="of">🖼️ Overframe<small>×${nOF}</small></button>` : ''}${rars.length <= 20 ? rars.map(x =>
      `<button class="chip${x.r === curR ? ' on' : ''}${isGMR(x.r) ? ' gmrc' : isStR(x.r) ? ' strc' : ''}" data-r="${esc(x.r)}">${isGMR(x.r) ? '🏆 ' : isStR(x.r) ? '✨ ' : ''}${esc(x.r)}${x.count > 1 ? `<small>×${x.count}</small>` : ''}</button>`).join('') : ''}</div>` : ''}
    <p class="lbl2">${T('Elige la versión')}</p>
    <select id="vsel">${labels.map((l, k) =>
      `<option value="${k}"${k === i ? ' selected' : ''}>${k + 1}. ${l.st ? '🏅 ' : ''}${l.str ? '✨ ' : ''}${l.of ? '🖼️ ' : l.gmr ? '🏆 ' : ''}${esc(ofText([l.t, l.r && !String(l.t).includes(l.r) ? l.r : ''].filter(Boolean).join(' · ')))}${l.p ? ' — ' + l.p : ''}</option>`).join('')}</select>`;
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    const r = b.dataset.r, x = b.dataset.x;
    const ks = labels.map((l, k) => (x ? l[x] : l.r === r) ? k : -1).filter(k => k >= 0);
    const isCur = x ? labels[i][x] : curR === r;
    if (x) return jump(isCur ? ks[(ks.indexOf(i) + 1) % ks.length] : ks[0]);
    // si ya estás en esa rareza, pasa a la siguiente versión de la misma rareza
    const next = curR === r ? ks[(ks.indexOf(i) + 1) % ks.length] : ks[0];
    jump(next);
  });
  $('vsel').onchange = e => jump(Number(e.target.value));
  const rail = $('rail');
  rail.querySelectorAll('.tile').forEach(b => b.onclick = () => jump(Number(b.dataset.k)));
  // la carrusel no debe disparar el cambio de versión al deslizarla
  rail.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });
  rail.addEventListener('touchend', e => e.stopPropagation());
  const on = rail.querySelector('.tile.on');
  if (on) rail.scrollTo({ left: rail.scrollLeft + on.getBoundingClientRect().left - rail.getBoundingClientRect().left - (rail.clientWidth - on.offsetWidth) / 2, behavior: 'instant' });
}

async function go(step){
  if (!current || current.items.length < 2) return;
  slideDir = step;
  current.index = (current.index + step + current.items.length) % current.items.length;
  const pic = out.querySelector('.pic'); if (pic) pic.classList.add('loading');
  await drawCurrent();
}

async function drawCurrent(){
  const me = current, i = me.index;
  let v;
  try { v = await me.build(me.items[i]); }
  catch (e) { console.error(e); return error(T('No se pudo cargar esta versión. Inténtalo otra vez.')); }
  if (me !== current || i !== me.index) return; // el usuario ya cambió de versión
  render(v);
}

// Dibuja una carta. v.rows = [[etiqueta, valor] | ['#Sección']]
function render(v){
  redraw = current ? () => drawCurrent() : () => render(v);
  const n = current?.items.length || 1, i = current?.index || 0;
  const isSec = r => r[0].startsWith('#');
  const kept = v.rows.filter(r => isSec(r) || r[1]);
  const clean = kept.filter((r, k) => !isSec(r) || (kept[k + 1] && !isSec(kept[k + 1])));
  const tr = clean.map(r => isSec(r)
    ? `<tr><td class="sec" colspan="2">${T(r[0].slice(1))}</td></tr>`
    : `<tr><td>${T(r[0])}</td><td>${r[1]}</td></tr>`).join('');
  const dots = n > 1 && n <= 24 ? `<div class="dots">${Array.from({length: n}, (_, k) => `<span class="dot${k === i ? ' on' : ''}"></span>`).join('')}</div>` : '';
  out.innerHTML = `
    ${backBtn()}
    <div class="result" id="result">
      <div class="pic">
        <img src="${v.img || NOIMG}" alt="${esc(v.name)}"${slideDir ? ` class="slide${slideDir > 0 ? 'R' : 'L'}"` : ''}>
        ${v.overframe || v.gmr || v.str || v.stamp ? `<span class="ofribs">${v.stamp ? `<span class="ofrib st">🏅 ${esc(v.stamp)}</span>` : ''}${v.str ? '<span class="ofrib str">✨ Starlight Rare</span>' : ''}${v.overframe ? '<span class="ofrib">🖼️ Overframe</span>' : ''}${v.gmr ? '<span class="ofrib gmr">🏆 Grand Master Rare</span>' : ''}</span>` : ''}
        ${v.alts ? `<div class="alts"><p class="replica">${T('Con este código se imprimieron varias versiones. Toca la tuya:')}</p><div class="altrow">${v.alts.map((a, k) =>
          `<button class="alt${k === 0 ? ' on' : ''}" data-k="${k}"><img src="${ygpThumb(a.url)}" alt="" loading="lazy"><span>${esc(a.label)}</span></button>`).join('')}</div></div>` : ''}
        ${v.replica ? `<p class="replica">${T('⚠️ No hay foto de esta impresión oficial: la imagen es solo de referencia (réplica de YGOPRODeck, «Not For Use in Sanctioned Tournaments»).')}</p>` : ''}
        ${n > 1 ? `<div class="nav">
            <button class="arrow" id="prev" aria-label="${T('Versión anterior')}">‹</button>
            <div class="vlabel"><b>${T('Versión {0} de {1}', i + 1, n)}</b>${v.stamp ? '🏅 ' : ''}${v.str ? '✨ ' : ''}${v.overframe ? '🖼️ ' : v.gmr ? '🏆 ' : ''}${esc(ofText(v.versionLabel || v.rarity || ''))}</div>
            <button class="arrow" id="next" aria-label="${T('Versión siguiente')}">›</button>
          </div>${dots}` : ''}
      </div>
      <div>
        <p class="name">${esc(v.name)}</p>
        ${v.subname ? `<p class="meta">${esc(v.subname)}</p>` : ''}
        <p class="meta">${v.meta}</p>
        ${v.rarity ? `<span class="rar">✦ ${esc(v.rarity)}</span>` : ''}${v.overframe ? ` <span class="rar ofr">🖼️ Overframe</span>` : ''}${v.gmr ? ` <span class="rar gmrr">🏆 GMR</span>` : ''}${v.str ? ` <span class="rar strr">✨ Starlight</span>` : ''}${v.stamp ? ` <span class="rar str2">🏅 ${esc(v.stamp)}</span>` : ''}
        ${v.stamp ? `<p class="ofnote">${T('Con el sello del Yu-Gi-Oh! World Championship estampado en el cuadro del efecto. Tiene un precio distinto al de la versión sin sello.')}</p>` : ''}
        ${v.gmr ? `<p class="ofnote">${T('Grand Master Rare: tirada muy corta con número de serie. Casi no hay ventas, así que a veces no hay precio público. Puedes añadirla igual a tu colección y poner tu precio de compra con ✏️.')}</p>` : ''}
        ${v.overframe ? `<p class="ofnote">${T('Versión Overframe (Extended Art): el dibujo sale del marco. Tiene un precio distinto al de la versión normal.')}${v.ofNoScan ? ' ' + T('Yugipedia aún no tiene foto de la versión Overframe: la imagen es la de la normal.') : ''}</p>` : ''}
        <div class="vspec" id="vspec"></div>
        <div class="picker" id="vpick"></div>
        <div class="big"><div class="lbl">${T(v.mainLabel)}</div><div class="val">${v.mainValue || T('Sin precio')}</div>
          ${v.approx ? `<div class="approx">${T(v.approx)}</div>` : ''}
          <div class="upd">${v.updated ? esc(v.updated) + ' · ' : ''}${T('consultado a las {0}', new Date().toLocaleTimeString(LOCALE(), {hour:'2-digit', minute:'2-digit'}))}
            ${v.reload ? `<button class="refresh" id="refresh">${T('🔄 Actualizar precio')}</button>` : ''}</div></div>
        <div class="mine" id="mine"></div>
        <table>${tr || `<tr><td>${T('No hay más precios disponibles')}</td><td></td></tr>`}</table>
        <div class="links">
          ${v.openSet ? `<button class="main" id="openSet">${T('📚 Ver la expansión entera')}</button>` : ''}
          ${v.links.filter(l => l[1]).map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${T(l[0])} ↗</a>`).join('')}
        </div>
        ${v.howto ? `<details class="howto" open><summary>${T('📖 Cómo se usa esta carta')}</summary><div id="howto"><p>${T('Cargando…')}</p></div></details>` : ''}
        ${v.sealed ? '' : gradingHTML(v.value)}
      </div>
    </div>`;
  if (v.howto) {
    const me = current, idx = current?.index;
    Promise.resolve().then(v.howto).then(html => {
      if (current === me && current?.index === idx && $('howto')) $('howto').innerHTML = html;
    }).catch(() => { if ($('howto')) $('howto').innerHTML = `<p>${T('No se pudo cargar la explicación.')}</p>`; });
  }
  wireBack();
  if (v.alts) out.querySelectorAll('.alt').forEach(b => b.onclick = () => {
    const a = v.alts[b.dataset.k];
    out.querySelector('.pic img').src = a.url;
    if (a.pv) out.querySelector('.big .val').innerHTML = a.pv;
    out.querySelectorAll('.alt').forEach(x => x.classList.toggle('on', x === b));
    const l = [...out.querySelectorAll('.links a')].find(x => x.href.includes('yugipedia.com/wiki/File:'));
    if (l) l.href = `https://yugipedia.com/wiki/File:${encodeURIComponent(a.file)}`;
  });
  if (n > 1) { $('prev').onclick = () => go(-1); $('next').onclick = () => go(1); }
  slideDir = 0;
  drawPicker();
  if (window.cuentaCard) window.cuentaCard(v); // botones "Mi colección" / "Favorito" (cuenta.js)
  preloadNeighbours();
  if (v.reload) $('refresh').onclick = async () => {
    $('refresh').textContent = T('Actualizando…');
    try { await v.reload(); } catch (e) { $('refresh').textContent = T('⚠️ Error, reintenta'); }
  };
  if (v.openSet) $('openSet').onclick = () => {
    const snap = { ...current };
    remember(() => { current = snap; drawCurrent(); });
    v.openSet();
  };
  // Deslizar con el dedo
  const box = $('result'); let x0 = null, y0 = null;
  box.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  box.addEventListener('touchend', e => {
    if (x0 == null) return;

// Rejilla de cartas (resultados de búsqueda o expansión entera)
// items: [{ img, title, sub, price, open }]
function renderGrid(title, items, { sort, chips, addAll } = {}){
  let chip = -1, armed = false;
  const draw = list => {
    redraw = () => $('q').value.trim() ? search() : (out.innerHTML = ''); // al cambiar idioma se vuelve a buscar
    out.innerHTML = `${backBtn()}
      <div class="bar"><h2>${title}</h2>
        ${sort ? `<select id="sort"><option value="num">${T('Ordenar por número')}</option><option value="hi">${T('Más caras primero')}</option><option value="lo">${T('Más baratas primero')}</option></select>` : ''}
      </div>
      ${addAll && window.cuentaAPI?.addMany && items.some(i => i.col) ? `<div class="addall"><button class="gbtn" id="addall">${T('➕ Añadir las {0} a mi colección', pool().filter(i => i.col).length)}</button>
        <span class="note">${T('Las que ya tienes no se duplican. Las nuevas se marcan con la lista #{0}.', esc(addAll))}</span></div>` : ''}
      ${chips?.length ? `<div class="chips gchips"><button class="chip${chip < 0 ? ' on' : ''}" data-c="-1">${T('Todas')} <small>${items.length}</small></button>${chips.map((c, k) =>
        `<button class="chip${chip === k ? ' on' : ''}" data-c="${k}">${c.t} <small>${items.filter(c.f).length}</small></button>`).join('')}</div>` : ''}
      <div class="list">${list.map((it, k) => `<div class="item${it.real ? ' rep' : ''}" data-k="${k}">${it.tags || ''}
          <img src="${it.img || NOIMG}" loading="lazy" alt="">
          <div>${esc(it.title)}</div>${it.sub ? `<div class="note">${esc(it.sub)}</div>` : ''}
          ${it.price ? `<div class="p">${it.price}</div>` : ''}</div>`).join('')}</div>`;
    wireBack();
    lazyReal(list);
    out.querySelectorAll('.item').forEach(el => el.onclick = () => {
      remember(() => draw(list));
      list[el.dataset.k].open();
    });
    if (sort) {
      $('sort').value = sortMode;
      $('sort').onchange = e => { sortMode = e.target.value; draw(sorted()); };
    }
    out.querySelectorAll('.gchips .chip').forEach(b => b.onclick = () => { chip = Number(b.dataset.c); armed = false; draw(sorted()); });
    const ab = $('addall');
    if (ab) ab.onclick = async () => {
      const api = window.cuentaAPI;
      if (!api?.user) return api?.login(T('Entra para guardar cartas en tu colección.'));
      const todo = pool().filter(i => i.col);
      if (!armed) { armed = true; ab.textContent = T('Pulsa otra vez para añadir {0} cartas', todo.length); return; }
      ab.disabled = true; let k = 0;
      const cards = [];
      for (const it of todo) { try { cards.push(await it.col()); } catch (e) {} ab.textContent = T('Preparando {0}/{1}…', ++k, todo.length); }
      const n = await api.addMany(cards, addAll, (a, b) => { ab.textContent = T('Guardando {0}/{1}…', a, b); });
      ab.textContent = T('✓ {0} cartas añadidas ({1} ya las tenías)', n, cards.length - n);
    };
  };
  let sortMode = 'num';
  setTimeout(toTop);
  function pool(){ return chip >= 0 && chips?.[chip] ? items.filter(chips[chip].f) : items; }
  const sorted = () => sortMode === 'num' ? pool() : [...pool()].sort((a, b) =>
    sortMode === 'hi' ? (b.v ?? -1) - (a.v ?? -1) : (a.v ?? 1e9) - (b.v ?? 1e9));
  draw(items);
}

// Cambia la imagen de referencia por la foto real cuando la tarjeta aparece en pantalla.
// it.real = async () => url | null
function lazyReal(list){
  const els = [...out.querySelectorAll('.item')].filter(el => list[el.dataset.k]?.real);
  if (!els.length) return;
  const queue = []; let busy = 0;
  const pump = () => { while (busy < 4 && queue.length) { const el = queue.shift(); busy++;
    list[el.dataset.k].real().then(u => { if (u) { const img = el.querySelector('img'); img.src = u; el.classList.remove('rep'); } })
      .catch(() => {}).finally(() => { busy--; pump(); }); } };
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); queue.push(e.target); pump(); } }), { rootMargin: '300px' });
  els.forEach(el => io.observe(el));
}

const PKM = 'https://api.tcgdex.net/v2/en';

const PTCG = 'https://images.pokemontcg.io/';
const LIMITLESS = 'https://limitlesstcg.nyc3.cdn.digitaloceanspaces.com/tpci/';

const PTCG_SET = { hgssp: 'hsp', bog: 'bp', exu: 'ex10', 'tk-ex-latia': 'tk1a', 'tk-ex-latio': 'tk1b', 'tk-ex-p': 'tk2a', 'tk-ex-m': 'tk2b' };
const TCGP = /^(?:[AB]\d+[a-z]?|P-[AB])$/;   // sets de Pokémon TCG Pocket (A1, B2a, P-A…): fotos de Limitless
// Celebrations · Classic Collection: TCGdex CC001… = pokemontcg.io «número original_letra» (comprobadas una a una)
const CEL25CC = { CC001: '2_A', CC002: '4_A', CC003: '15_A', CC004: '73_A', CC005: '8_A', CC006: '15_B', CC007: '15_C', CC008: '24_A', CC009: '20_A',
  CC010: '66_A', CC011: '9_A', CC012: '86_A', CC013: '88_A', CC014: '93_A', CC015: '17_A', CC016: '15_D', CC017: '109_A', CC018: '145_A', CC019: '107_A',
  CC020: '113_A', CC021: '114_A', CC022: '54_A', CC023: '97_A', CC024: '76_A', CC025: '60_A' };
function ptcgCands(set, num){
  const s = String(set).toLowerCase(), z = s.replace(/^([a-z]+)0+(\d)/, '$1$2');
  const sets = [...new Set([s, z.replace('.', 'pt'), z.replace('.', ''), s.replace('.', ''), z, s.replace(/cc$/, 'c')])];
  // colecciones que pokemontcg.io llama de otra forma
  const mcd = s.match(/^20(\d\d)[a-z]+$/);
  sets.unshift(...[mcd ? 'mcd' + mcd[1] : '', PTCG_SET[s] || ''].filter(Boolean));
  const nums = [...new Set([String(num).replace(/^0+(?=.)/, ''), String(num), String(num).replace(/^([A-Z]+)0+(?=\d)/i, '$1')])].map(encodeURIComponent);
  return sets.flatMap(a => nums.map(n => `${a}/${n}`));
}
const pkmImg = (c, q) => {
  if (c.image) return `${c.image}/${q}.webp`;
  const id = c.id || '', k = id.lastIndexOf('-');
  const set = c.set?.id || (k > 0 ? id.slice(0, k) : ''), num = c.localId || (k > 0 ? id.slice(k + 1) : '');
  if (!set || !num) return NOIMG;
  const sfx = q === 'high' ? '_hires.png' : '.png', sl = String(set).toLowerCase();
  const n3 = /^\d+$/.test(num) ? String(num).padStart(3, '0') : num, SET = String(set).toUpperCase();
  const serie = (sl.startsWith('cel') ? 'swsh' : PKM_SERIES.find(p => sl.startsWith(p))) || '';

  return withAlts([
    sl === 'cel25cc' && CEL25CC[num] ? PTCG + 'cel25c/' + CEL25CC[num] + sfx : '',
    ...ptcgCands(set, num).map(x => PTCG + x + sfx),
    `${LIMITLESS}${SET}/${SET}_${n3}_R_EN_${q === 'high' ? 'LG' : 'SM'}.png`,
    // la misma carta en otro idioma (TCGdex a veces tiene la foto en francés, alemán… pero no en inglés)
    ...(serie ? PKM_LANGS.map(l => `https://assets.tcgdex.net/${l}/${serie}/${set}/${num}/${q}.webp`) : []),

const pkmSets = {};
async function pokemonSetIds(code){
  code = code.toUpperCase();
  if (!pkmSets[code]) pkmSets[code] = ((await getJSON(`${PKM}/sets?abbreviation.official=${encodeURIComponent(code)}`)) || []).map(s => s.id);
  return pkmSets[code];
}
async function cardsInSets(setIds, num){
  const n = String(num).replace(/^0+(?=.)/, '');
  const found = await Promise.all(setIds.map(async id =>
    (await getJSON(`${PKM}/sets/${id}/${n}`).catch(() => null)) ||
    (await getJSON(`${PKM}/sets/${id}/${n.padStart(3, '0')}`).catch(() => null))));
  return found.filter(c => c && c.id);

async function searchPokemon(q){
  let m, cards = [];
  if (/^[a-z0-9.]+-[a-z0-9]+$/i.test(q)) {
    const id = q.toLowerCase();
    const c = await getJSON(`${PKM}/cards/${id}`) ||
              await getJSON(`${PKM}/cards/${id.replace(/^([a-z]+)(\d)(?=\D)/, '$10$2')}`);
    if (c) cards = [c];
  } else if ((m = q.match(/^0*(\d+)\s*\/\s*0*(\d+)$/))) {
    const sets = (await getJSON(`${PKM}/sets?cardCount.official=${m[2]}`)) || [];
    cards = await cardsInSets(sets.map(s => s.id), m[1]);
  } else if ((m = q.match(/^([a-z0-9-]{2,6})\s+(\w+?)(?:\/\d+)?$/i))) {
    const ids = await pokemonSetIds(m[1]);
    if (!ids.length) return error(T('No conozco el set "{0}". Revisa el código.', esc(m[1].toUpperCase())));
    cards = await cardsInSets(ids, m[2]);
  } else {
    const list = (await getJSON(`${PKM}/cards?name=${encodeURIComponent(q)}`)) || [];
    if (!list.length) return error(T('No encontré esa carta. Revisa el código (ej. OBF 125).'));
    if (list.length === 1) return openPokemon(await getJSON(`${PKM}/cards/${list[0].id}`));
    return renderGrid(T('{0} resultados', list.length), list.slice(-80).reverse().map(b => ({
      img: pkmImg(b, 'low'), title: b.name, sub: b.id,
      open: async () => { loading(T('Cargando…')); openPokemon(await getJSON(`${PKM}/cards/${b.id}`)); } })));
  }
  if (!cards.length) return error(T('No encontré esa carta. Revisa el código (ej. OBF 125).'));
  if (cards.length === 1) return openPokemon(cards[0]);
  renderGrid(T('{0} cartas con ese número', cards.length), cards.map(c => ({
    img: pkmImg(c, 'low'), title: c.name, sub: `${c.set.name} ${c.localId}`, open: () => openPokemon(c) })));
}

// Versiones = todas las cartas con el mismo nombre (otras expansiones / ilustraciones)
const pkmCache = {};
async function openPokemon(c){
  pkmCache[c.id] = c;
  let others = [];
  try { others = (await getJSON(`${PKM}/cards?name=eq:${encodeURIComponent(c.name)}`)) || []; } catch (e) {}
  if (!others.some(o => o.id === c.id)) others.unshift({ id: c.id });
  others = others.slice(-60);
  const idx = others.findIndex(o => o.id === c.id);
  const label = o => { const f = pkmCache[o.id];
    return f ? { r: f.rarity, t: `${f.set?.name} · ${f.localId}`, p: eur(f.pricing?.cardmarket?.trend), i: pkmImg(f, 'low') } : { r: '', t: o.id, i: pkmImg(o, 'low') }; };
  await showVersions(others, idx, async o => {
    const full = pkmCache[o.id] || (pkmCache[o.id] = await getJSON(`${PKM}/cards/${o.id}`));
    return pokemonView(full);
  }, label);
  // carga en segundo plano las demás versiones para saber su rareza y precio
  const mine = current; let k = 0;
  await Promise.all(Array.from({ length: 4 }, async () => {
    while (k < others.length) {
      const o = others[k++];
      if (!pkmCache[o.id]) pkmCache[o.id] = await getJSON(`${PKM}/cards/${o.id}`).catch(() => null);
      if (pkmCache[o.id] === null) delete pkmCache[o.id];
    }
  }));
  if (current === mine) drawPicker();
}

// =====================================================================
const YGO = 'https://db.ygoprodeck.com/api/v7';
// Las imágenes de YGOPRODeck son recreaciones que llevan «Replica - Not For Use in Sanctioned Tournaments».
// Para enseñar la carta real usamos los escaneos oficiales de Yugipedia (uno por impresión: set, idioma, rareza y edición).
const YGP = 'https://yugipedia.com/api.php?action=query&list=allimages&aiprop=url&ailimit=500&format=json&origin=*&aiprefix=';
const ygpKey = n => String(n || '').normalize('NFD').replace(/[^A-Za-z0-9]/g, '');
const RAR_ABBR = { 'Common': ['C', 'SP'], 'Short Print': ['SP', 'C'], 'Rare': ['R'], 'Super Rare': ['SR'], 'Ultra Rare': ['UR'],
  'Secret Rare': ['ScR'], 'Ultimate Rare': ['UtR'], 'Ghost Rare': ['GR'], 'Gold Rare': ['GUR'], 'Ghost/Gold Rare': ['GGR'],
  'Premium Gold Rare': ['PGR'], 'Gold Secret Rare': ['GScR'], 'Prismatic Secret Rare': ['PScR'], 'Extra Secret Rare': ['EScR'],
  'Starlight Rare': ['StR'], "Collector's Rare": ['CR'], 'Quarter Century Secret Rare': ['QCScR'], 'Platinum Secret Rare': ['PlScR'],
  'Platinum Rare': ['PlR'], 'Mosaic Rare': ['MSR'], 'Shatterfoil Rare': ['SHR'], 'Starfoil Rare': ['SFR'], 'Super Short Print': ['SSP'],
  'Duel Terminal Normal Parallel Rare': ['DNPR'], 'Duel Terminal Super Parallel Rare': ['DSPR'], 'Duel Terminal Ultra Parallel Rare': ['DUPR'],
  'Duel Terminal Normal Rare Parallel Rare': ['DNRPR'], 'Duel Terminal Rare Parallel Rare': ['DRPR'],
  'Normal Parallel Rare': ['NPR'], 'Super Parallel Rare': ['SPR'], 'Ultra Parallel Rare': ['UPR'], 'Ultra Rare (Pharaoh\'s Rare)': ['URPR'],
  '10000 Secret Rare': ['10000ScR'], 'Ghost Secret Rare': ['GScR'], 'Grand Master Rare': ['GMR'],
  // nombres que usa TCGplayer
  "Prismatic Collector's Rare": ['PCR', 'CR'], 'Prismatic Ultimate Rare': ['PUR', 'UtR'], 'Starfoil Rare': ['SFR'], 'Starfoil': ['SFR'],
  'Parallel Rare': ['NPR', 'SPR', 'UPR', 'PR'], 'Duel Terminal Technology Common': ['DNPR', 'C'], 'Duel Terminal Technology Ultra Rare': ['DUPR', 'UR'],
  'Duel Terminal Rare Parallel Rare': ['DRPR'], 'Duel Terminal Super Parallel Rare': ['DSPR'], 'Duel Terminal Ultra Parallel Rare': ['DUPR'] };
const scanCache = {};
async function ygpScans(name, setPrefix){
  const pre = ygpKey(name) + '-' + (setPrefix ? setPrefix + '-' : '');
  return scanCache[pre] ||= (async () => {
    const all = []; let cont = '';
    for (let page = 0; page < 5; page++) {
      const r = await getJSON(YGP + encodeURIComponent(pre) + (cont ? '&aicontinue=' + encodeURIComponent(cont) : ''));
      all.push(...(r?.query?.allimages || []));
      cont = r?.continue?.aicontinue; if (!cont) break;
    }
    return all.map(f => {
      const base = f.name.replace(/\.[a-z]+$/i, '');
      const t = base.slice(ygpKey(name).length + 1).split('-');
      // las cartas japonesas no llevan edición: "X-LOCH-JP-UR-EA" -> "EA" es un extra, no la edición
      const hasEd = /^(1E|UE|LE|DT)$/.test(t[3] || '');
      return { url: f.url, file: f.name, set: t[0], reg: t[1], rar: t[2], ed: hasEd ? t[3] : undefined, extra: hasEd ? t.slice(4) : t.slice(3) };
    }).filter(x => x.set && x.reg && !x.extra.includes('OP') && x.rar !== 'OP' && x.ed !== 'OP');
  })().catch(() => (delete scanCache[pre], []));
}
function ygpRegion(code){
  const m = String(code || '').toUpperCase().match(/^[A-Z0-9]+-([A-Z]*)\d/);
  const l = !m ? 'EN' : m[1].length > 2 ? m[1].slice(0, 2) : m[1]; // LDK2-ENK01 → EN
  return ({ '': 'NA', E: 'EU', A: 'AU', S: 'SP', G: 'DE', F: 'FR', I: 'IT', P: 'PT', K: 'KR', J: 'JP', SP: 'SP', EN: 'EN', DE: 'DE', FR: 'FR', IT: 'IT', PT: 'PT', KR: 'KR', JP: 'JP' })[l] || l;
}
// Elige el escaneo que corresponde a esa impresión (o null si Yugipedia no lo tiene)
// Todas las impresiones reales que encajan con ese código y rareza (p. ej. LOB-EN001: original, reimpresión y 25 aniversario)
function scanGroup(scans, code, rarity, of){
  const best = pickScan(scans, code, rarity, of);
  if (!best) return [];
  const ea = best.extra.includes('EA');
  const g = scans.filter(x => x.set === best.set && x.reg === best.reg && x.rar === best.rar && x.extra.includes('EA') === ea && !x.extra.some(e => /^(German|Italian|French|Spanish|Portuguese|GC|OP)$/.test(e)));
  const ord = x => (x.extra.length ? 10 : 0) + ({ '1E': 0, 'UE': 1, 'LE': 2 }[x.ed] ?? 3);
  return [best, ...g.filter(x => x !== best).sort((a, b) => ord(a) - ord(b))];
}
const ED_NAME = { '1E': '1ª edición', 'UE': 'Edición ilimitada', 'LE': 'Edición limitada', 'DT': 'Duel Terminal' };
const EXTRA_NAME = { 'Reprint': 'Reimpresión', '25thAnniversaryEdition': '25 aniversario' };
const scanLabel = x => [T(ED_NAME[x.ed] || x.ed || ''), ...x.extra.map(e => T(EXTRA_NAME[e] || e))].filter(Boolean).join(' · ');
// of = true: versión Overframe (Yugipedia la marca con «-EA»); false: la normal; undefined: cualquiera
function pickScan(scans, code, rarity, of){
  if (!scans?.length) return null;
  const set = code ? String(code).toUpperCase().split('-')[0] : null;
  const reg = code ? ygpRegion(code) : 'EN';
  const ab = RAR_ABBR[rarity] || [];
  let best = null, bs = -1, bestEA = null, bsEA = -1;
  for (const x of scans) {
    if (set && x.set.toUpperCase() !== set) continue;
    let sc = 0;
    if (x.reg === reg) sc += 8; else if (['EN', 'NA', 'EU'].includes(x.reg) && ['EN', 'NA', 'EU'].includes(reg)) sc += 3; else if (code) continue;
